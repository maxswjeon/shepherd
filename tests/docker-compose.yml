# MinIO for the M2 end-to-end leg (§6 Phase 2).
#
# ---------------------------------------------------------------------------
# TWO BUCKETS, DELIBERATELY, AND THE REASON IS A SAFETY CLAIM
# ---------------------------------------------------------------------------
# §4.10.2's S3 rider: **bucket versioning is off by default**, so an ordinary
# S3 or MinIO bucket lands on attestation mechanism **B** (content
# self-attestation), not mechanism A (provider version identity). The plan is
# explicit that "silently landing on B while believing A is exactly how a safety
# claim decays into a slogan", and requires M2's test configuration to either
# pin versioning on or exercise the surrogate deliberately.
#
# This file does BOTH, and says which is which:
#
#   shepherd-versioned  -- versioning explicitly enabled  -> mechanism A
#   shepherd-plain      -- left at the default, off       -> mechanism B
#
# Neither is assumed. `S3Adapter::probe_attestation_mode` asks the server, and
# `crates/shepherd-storage/tests/minio.rs` asserts that what it reports matches
# the bucket it was pointed at. If MinIO were to refuse versioning on this
# deployment shape, that assertion fails loudly rather than the suite quietly
# testing B twice while its name says A.
#
# ---------------------------------------------------------------------------
# WHY FOUR DRIVES IN ONE CONTAINER
# ---------------------------------------------------------------------------
# MinIO supports versioning only on an erasure-coded backend. A single-drive
# deployment is exactly the configuration where `mc version enable` can fail,
# which would leave the "versioned" bucket silently unversioned — the failure
# this file exists to prevent. Four drives in one container is the smallest
# erasure set, so mechanism A is genuinely reachable in CI.
#
# ---------------------------------------------------------------------------
# RUNNING IT
# ---------------------------------------------------------------------------
#   docker compose -f tests/docker-compose.yml up -d --wait
#   SHEPHERD_MINIO_ENDPOINT=http://127.0.0.1:9000 \
#     cargo test -p shepherd-storage --test minio -- --ignored --nocapture
#   docker compose -f tests/docker-compose.yml down -v
#
# The integration tests are `#[ignore]`d so that a plain `cargo test
# --workspace` stays green on a machine with no Docker. A test that silently
# passes when its dependency is absent is worse than one that is skipped
# visibly.

name: shepherd-tests

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data1 /data2 /data3 /data4 --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shepherdtest
      MINIO_ROOT_PASSWORD: shepherdtest
      # Keep the server quiet about update checks in CI.
      MINIO_UPDATE: "off"
    # The four drives must EXIST. In multi-drive mode MinIO does not create
    # them, it waits: without these volumes the server logs "Unable to use the
    # drive /data1: drive not found" forever and never reaches quorum, while
    # `/minio/health/live` still answers 200.
    volumes:
      - data1:/data1
      - data2:/data2
      - data3:/data3
      - data4:/data4
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    # Two things here were wrong on the first try and are recorded so they are
    # not re-broken:
    #
    #  1. NOT `mc ready local`. `mc` ships in this image but has no alias
    #     configured inside it, so that check reports "the cluster 'local' is
    #     not ready" forever — observed failing 27 times in a row while
    #     `curl .../health/live` returned 200.
    #  2. `/health/cluster`, NOT `/health/live`. `live` answers 200 while the
    #     erasure set is still being formatted, and `mc alias set` against it
    #     then fails with "Server not initialized yet, please try again".
    #     `cluster` reports ready only when the deployment can serve.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/cluster"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 5s

  # Creates the buckets and turns versioning on for exactly one of them.
  #
  # `mc version enable` is checked, not fired and forgotten: if it fails the
  # init container exits non-zero and `--wait` reports the dependency as
  # unhealthy, so the suite never runs against a bucket whose attestation mode
  # is not what the file claims.
  createbuckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    # The alias is retried rather than attempted once: cluster health can flip
    # ready a moment before the credential subsystem accepts a login, and a
    # one-shot `mc alias set` turns that race into a red suite.
    entrypoint: >
      /bin/sh -c "
      set -eu;
      i=0;
      until mc alias set local http://minio:9000 shepherdtest shepherdtest; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then echo 'minio never became usable'; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing local/shepherd-versioned;
      mc mb --ignore-existing local/shepherd-plain;
      mc version enable local/shepherd-versioned;
      v=$$(mc version info local/shepherd-versioned);
      case \"$$v\" in *'versioning is enabled'*) ;;
        *) echo \"FATAL: versioning did not take: $$v\"; exit 1;; esac;
      p=$$(mc version info local/shepherd-plain);
      case \"$$p\" in *'un-versioned'*) ;;
        *) echo \"FATAL: the plain bucket is not un-versioned: $$p\"; exit 1;; esac;
      echo 'shepherd-versioned: versioning ENABLED  -> attestation mechanism A';
      echo 'shepherd-plain:     versioning default  -> attestation mechanism B';
      "

# Ephemeral: `docker compose -f tests/docker-compose.yml down -v` removes them,
# so every run starts from an empty deployment and no test can pass by reading
# a previous run's object.
volumes:
  data1:
  data2:
  data3:
  data4:
