[package]
name = "shepherd-bench"
description = "Fixture generator and benchmark harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "shepherd-bench"
path = "src/main.rs"

[dependencies]
shepherd-core.workspace = true

serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# --- Phase 0b bake-off dependencies ------------------------------------------
#
# These are SPIKE dependencies, not production selections. Only the winner of
# the §4.6 tiebreak survives into `shepherd-index` at Phase 1 (task T7); the
# losers are dropped from this manifest at that point. `shepherd-bench` is
# `publish = false` and is not depended on by any other workspace crate, so
# nothing here reaches a shipping binary.

# Candidate (a): in-RAM name arena + SIMD substring scan.
memchr = "2"

# Candidate (b): tantivy inverted index with an n-gram tokenizer.
tantivy = "0.26.1"

# Candidate (c): SQLite FTS5-trigram. `bundled` pins the SQLite build so the
# measurement does not silently depend on whatever libsqlite3 the host ships.
# Inherits the workspace pin (0.40.2, ADR-001). Do NOT pin a version here:
# `libsqlite3-sys` carries `links = "sqlite3"`, so cargo permits exactly one
# version in the graph — a local pin here collides with `shepherd-catalog` and
# takes out every workspace-scoped command for every worker.
#
# It also matters for the measurement, not just the build: 0.37 and 0.40.2
# bundle different SQLite versions, and this crate benchmarks FTS5-trigram.
# Benchmarking FTS5 on a SQLite the product does not ship would make the 0b
# index decision describe something other than the product. Record the actual
# bundled SQLite version in `bench-contract.toml` alongside the rustc version.
rusqlite = { workspace = true }

# Vector ANN under test (§4.6 primary; not a bake-off candidate — the bake-off
# there is over f32/f16/i8 precision, not over crates).
usearch = "2.26"

# Fixture generation and the brute-force recall oracle are embarrassingly
# parallel; the query clients are threads, not tasks (no async runtime in the
# harness on purpose).
rayon = "1"
