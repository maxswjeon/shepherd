[package]
name = "shepherd-tier"
description = "THE DESTROY PATH: plan, upload, verify, revalidate, destroy, restore, audit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
shepherd-core.workspace = true
# §4.1 rule 2: THE permitted edge. No other crate may draw it.
shepherd-placeholder.workspace = true
shepherd-catalog.workspace = true
# The discard predicate and AC-14's preview gate live here. The direction is
# tier -> rules: rules DECIDES, tier EXECUTES. `shepherd-rules` deliberately
# holds no edge to `shepherd-placeholder` (§4.1 rule 2), which works only
# because this crate translates platform events into the values the predicate
# consumes — see `discard.rs`.
shepherd-rules.workspace = true
shepherd-scan.workspace = true
shepherd-storage.workspace = true
blake3 = { workspace = true }
# The breaker's rolling rate window and candidate set are PERSISTED (§4.4's
# `discard_rate_window` / `discard_candidate`). An in-memory counter would make
# the breaker evadable by restarting the daemon, which is the failure a rate
# limit most needs to survive.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# §4.1 rule 4 makes a second `StorageAdapter` double ILLEGAL, not merely
# wasteful: `delete_object` may be implemented only under
# `crates/shepherd-storage/src/`. Sharing worker-4's `MemAdapter` was therefore
# the only legal fix — widening the policy would have been the wrong one.
shepherd-storage = { workspace = true, features = ["testing"] }
memmap2 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
