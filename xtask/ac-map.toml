[[guard]]
id = "G-1-INSTALL-MACOS"
owning_gate = "1"
exercises = ["shepherd-daemon::service"]
note = """
§9: `and macOS (LaunchAgent)`. CLOSED, including the half a headless box could
not answer.

`launchctl bootstrap` acceptance, the agent running with a real pid, and a
clean `bootout`/`uninstall` were demonstrated on host hardware earlier. What
remained was §9's actual verb reaching all the way to LOGIN, and it is now
measured POSITIVE in a throwaway `tart` VM (macOS 26.6.1, cloned from
`macos-tahoe-base`, destroyed afterwards) rather than by changing the host's
auto-login posture.

THREE COLD BOOTS, and the middle one only means something because of the other
two. Boot 1 installed via the real `shepherdd install`, then STERILIZED:
`bootout`, `launchctl print` answering `Could not find service`, no process,
`~/.local/state/shepherd` deleted, and the label verified ABSENT from
`print-disabled` so no disabled override crossed the reboot. Only the plist
did. Boot 2, with nobody logging in by hand, gave `state = running`,
`runs = 1`, `properties = runatload`, and a socket and catalog rebuilt +34 s
after boot having been deleted before shutdown — with the daemon starting at
17:48:24 against a first contact with the guest at 17:48:31, so it was already
running before anyone spoke to the VM. Boot 3 was the control: same VM, same
auto-login, `uninstall` the only variable, sampled at +150 s — far past the
+31 s the positive took, so `absent` cannot mean `sampled too early`. Nothing
ran, while the BINARY and the `gui/501` login domain (427 active services) both
remained present, so the absence names the LaunchAgent rather than a missing
binary or a missing session.

A DEFECT IN THE METHOD, caught before it became a finding: the Mac's prebuilt
`shepherdd` predated the `libc::getuid()` fix and still carried the literal
`$(id -u)`. Shipping it would have reproduced `Unrecognized target specifier`,
the agent would never have loaded, and the report would have read `does not
start at login` — a false red indistinguishable from a real one. The binary
under test is pinned to `ae6e43e`, sha256 `c4e6d2c1...`, verified identical at
every hop.

PLATFORM-BOUND AND NOT GATE-EXECUTABLE, like G-0C-SPIKES. The gate runs
`cargo test` on Linux; `launchd` and `loginwindow` are macOS components and a
cold boot is not a cargo target. The Linux half IS gate-executable and is cited
below. Evidence for the macOS half:
`.omc/artifacts/g1-install-macos-login/` — REPORT.md plus the raw per-boot
captures. Auto-login was already enabled in the base image; it is the
instrumentation that PRODUCES a login, not the claim under test, and the
sterilized pre-reboot state plus the uninstalled control are what isolate the
claim.
"""

[[guard.evidence]]
package = "shepherd-daemon"
test = "service::launchd::tests::the_plist_is_well_formed_and_starts_the_daemon_in_run_mode"
proves = "PARTIAL — the emitted plist is XML with balanced dict/array tags, carries the executable path and the `run` argument, and names the label. Well-formedness asserted structurally rather than by eye"

[[guard.evidence]]
package = "shepherd-daemon"
test = "service::launchd::tests::the_plist_does_not_fight_the_user"
proves = "RunAtLoad is present and KeepAlive is ABSENT — the macOS form of restart-on-failure-only, asserted in both directions for the same reason"

[[guard.evidence]]
package = "shepherd-daemon"
test = "service::launchd::tests::the_domain_target_is_a_real_uid_and_never_a_shell_substitution"
proves = "the defect the hardware round trip exposed, pinned so it cannot return: the launchctl domain target contains no shell substitution and is a real numeric uid, checked against `id -u` rather than against libc::getuid() — comparing the implementation to itself would pass just as happily on the broken version. Both `bootstrap` and `bootout` took the same broken target, so uninstall was affected identically. Before this, every assertion in this module was about the plist's TEXT, and a well-formed plist that launchd never loads passes all of them"

