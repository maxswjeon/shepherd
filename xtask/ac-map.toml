exercises = ["shepherd-proto", "shepherd-cli", "xtask::codegen"]
note = "schema stability at 1; re-asserted at 8"

# "Stable machine-readable output" is only meaningful if drift is DETECTABLE.
# Determinism alone is not stability — a generator that is deterministic and a
# checker that never fails would satisfy the word and none of the intent.

[[ac.evidence]]
package = "xtask"
test = "codegen::tests::generation_is_deterministic"
proves = "the same method table produces byte-identical artifacts, so a diff means a real change rather than generator noise"

[[ac.evidence]]
package = "xtask"
test = "codegen::tests::check_reports_missing_differing_and_stale_files"
proves = "the half that makes determinism load-bearing: --check actually FAILS on missing, differing and stale artifacts. Without this the checker could pass unconditionally and `codegen --check` in CI would assert nothing"

[[ac.evidence]]
package = "xtask"
test = "codegen::tests::every_method_gets_a_request_and_a_result_schema"
proves = "coverage is derived from the method table rather than a hand-kept list, so a new method cannot ship without schemas"

[[ac.evidence]]
package = "shepherd-proto"
test = "method::tests::schemas_are_deterministic"
proves = "determinism at the source, upstream of codegen — so a drift reported by --check is attributable to the table rather than to schemars ordering"

