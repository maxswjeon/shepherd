proves = """
a valid deep page FAILED with `too many SQL variables` — `hydrate` bound
one parameter per candidate and an unfiltered `cap = offset + limit` is
unbounded. The limit is MEASURED for this build, not remembered: binary-searching
`prepare()` gives 32766 (rusqlite 0.40.2 / bundled libsqlite3-sys 0.38.2), not
the 999 that predates SQLite 3.32.

THE FIX IS CHUNKING, NOT CAPPING. Clamping at `MAX_CANDIDATES` would return a
legitimate page empty with a `degraded` note — a refusal in an answer's costume.
Rows are placed at candidate indices 9,000 / 35,000 / 39,999 precisely so a
clamp fails this test.
