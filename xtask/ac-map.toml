# ---------------------------------------------------------------------------
# [[phase]] — §9's gate rows, clause by clause.
# ---------------------------------------------------------------------------
#
# Consumed by `xtask/src/phase_completeness.rs`, which runs on every
# `gate --audit` and reconciles this file against §9's table. The rules it
# enforces, and what each one is for:
#
#   * `quote` must appear VERBATIM in the row, inside a single clause. Editing
#     §9 therefore breaks the check loudly instead of leaving an encoding that
#     still reads as current. A quote that spans two clauses is rejected, so one
#     quote cannot claim two demands.
#   * `covered_by` ids must exist and be owned by a phase THIS gate runs, so a
#     clause cannot be carried by something the gate never executes.
#   * `unencoded` states that nothing carries the clause. It keeps the demand
#     visible and the gate red. It is the honest answer, not a waiver.
#   * `rationale` marks a clause that demands no evidence — scope, reasoning,
#     or an explicit deferral. The most abusable field here, which is why it
#     requires the quote, prints in `--show-clauses`, is counted separately
#     rather than folded into "carried", and must say why in writing.
#
# `gate --phase <id>` FAILS on any clause of its row that is unencoded or
# stated-gap. Under-specifying a phase is still possible; doing it quietly is
# not.
#
# ROWS 2..9 ARE DELIBERATELY NOT ENCODED HERE. Their clauses report as
# UNENCODED, which is accurate — no one has reconciled them — and it keeps this
# change to the phases it is about. Encoding a future phase's row from the
# outside is how a requirement gets recorded as someone imagined it rather than
# as its owner reads it. The AC-level reconciliation below covers every row.

[[phase]]
gate = "0ab"

[[phase.requirement]]
quote = "with metadata p95, vector p95 and index RSS at 10M"
covered_by = ["G-0B-BARS"]

[[phase.requirement]]
