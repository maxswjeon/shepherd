timestamp authorised the action — and that record is what the operator approves
a destructive rule against. The fixture makes the mislabel provably wrong: mtime
is one day old and so cannot satisfy a 365-day predicate, meaning `Mtime` names
a timestamp that does not drive the match.

WHY THIS IS WORSE THAN A COSMETIC BUG: round 2 made execution refuse when the
signal drifts from the preview's, on the argument that a preview saying
`Observed` and a run proceeding on `Atime` is the substitution the whole
`AtimeMode` apparatus exists to prevent. That refusal is only as good as the
labels, and one label was a lie.
"""

[[ac.evidence]]
package = "shepherd-rules"
test = "engine::tests::a_ctime_rule_previews_as_ctime_and_a_preview_labelled_mtime_refuses"
proves = """
the upgrade behaviour, asserted rather than discovered: a preview taken
before this change and executed after it now drifts `Mtime -> Ctime` and
refuses. Correct and fail-closed, but visible, so it is pinned — and the same
test asserts a preview taken by THIS build still executes, so the refusal is not
`refuse everything`.

Checked and recorded: there is NO `match` on `AccessSignalSource` anywhere in
the workspace, so no wildcard arm can silently mislabel, and the enum is
deliberately NOT `#[non_exhaustive]` so an external exhaustive match would be a
compile error rather than a wrong answer. `shepherd_catalog::AccessSignal` is a
SEPARATE, parallel enum whose schema CHECK admits `observed|atime|mtime` only —
an obvious `impl From` would compile and fail at runtime; the hazard is
documented on the enum.
"""

