id = "G-1-INSTALL-MACOS"
owning_gate = "1"
exercises = ["shepherd-daemon::service"]
note = "§9: `and macOS (LaunchAgent)`"
evidence_missing = """
THE HARDWARE EXISTS NOW AND THE ROUND TRIP RAN. WHAT IS STILL MISSING IS \
`AT LOGIN`, AND IT IS THE HALF A HEADLESS BOX CANNOT ANSWER. This row \
previously read `HARDWARE ... there is no Mac here`; that sentence is retired.

WHAT RAN, on macOS 26.5.2 (Mac16,10, arm64): `plutil -lint` OK; \
`launchctl bootstrap gui/501 <plist>` exit 0; `launchctl print \
gui/501/kr.swjeon.shepherd` reporting `state = running`, a real pid, \
`last exit code = (never exited)` and `properties = runatload` — launchd \
echoing back that it parsed the key. The agent did not merely load, it WORKED: \
it created `catalog.db`, `catalog.db-wal` and `daemon.sock` under \
`~/.local/state/shepherd`. Teardown clean — `bootout` exit 0, no process, \
`shepherdd uninstall` removed the plist, machine left as found.

A DEFECT FOUND BY DOING IT, which is the argument for §9's verb being \
`installs` rather than `generates`: `launchd.rs::uid()` read \
`std::env::var("UID")` and fell back to the LITERAL STRING `"$(id -u)"`. \
`Command::new` invokes no shell, and `UID` is a shell parameter rather than an \
exported variable (`env | grep -c '^UID='` is 0 on a normal login), so the \
fallback was the LIVE path, not the rare one. `launchctl` received \
`gui/$(id -u)`, answered `Unrecognized target specifier`, exited 64, the agent \
never loaded — AND `shepherdd install` STILL EXITED 0, because a failed \
bootstrap is recorded as a note. Clean A/B: exporting `UID=501` and changing \
nothing else made the identical binary load the agent. Fixed to \
`libc::getuid()`; the exit-0-on-bootstrap-failure behaviour is deliberately \
UNCHANGED, because on a headless Mac there is no GUI session and that \
bootstrap SHOULD fail without failing the install.

WHAT IS STILL MISSING, and why it is not closable here: §9's clause includes \
the agent starting AT LOGIN, and that was NOT demonstrated. `bootstrap` plus \
`RunAtLoad` accepted plus the agent genuinely running is not the same claim. \
`defaults read /Library/Preferences/com.apple.loginwindow autoLoginUser` does \
not exist, so auto-login is off, and a reboot over headless SSH produces no GUI \
session — making the result INCONCLUSIVE rather than negative. It closes with a \
console operator or with auto-login enabled, and not otherwise.
"""

