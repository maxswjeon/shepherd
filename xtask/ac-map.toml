[[ac]]
id = "AC-60"
owning_gate = "8"
exercises = ["ui", "shepherd-cli", "shepherd-daemon"]
note = """
named in the Phase 8 gate now — iteration 1's appendix claimed it, the gate did \
not. Evidence recorded at Phase 1 though it will not RUN until Phase 8: the \
daemon-side legs are already tested and the mapping is cheap to make once, by \
someone who has just read all twenty-three of shepherd-daemon's e2e tests, and \
expensive to reconstruct six phases later by someone who has not. Sec8.2 maps \
the handshake territory here explicitly.\
"""
evidence_missing = """
THE UI HALF CANNOT EXIST YET, AND NOTHING EXERCISES CONCURRENCY. AC-60 is `CLI \
and UI observe identical state; concurrent mutations serialize` and neither \
clause is fully proven. (i) There is no UI until Phase 8, so what is proven is \
that TWO IPC CLIENTS observe identical state — a weaker and different claim, \
since both speak the same protocol through the same code path while the UI is \
a separate client. (ii) `two_clients_are_served_concurrently` performs ONE \
mutation and reads it back; nothing anywhere drives concurrent mutations, so \
`serialize` rests on `shepherd-catalog`'s single-writer actor (G-1-WRITER) \
rather than on any test of this AC.

Stated now rather than discovered at Phase 8: without this, the cited tests \
would all pass and the gate would report AC-60 green over a UI that does not \
exist — which is the vacuous pass this map exists to refuse, and adding \
evidence without adding this note is exactly how it would have been \
introduced.\
"""

[[ac.evidence]]
package = "shepherd-daemon"
test = "two_clients_are_served_concurrently"
proves = "PARTIAL — two independent connections observe the same catalog: client A adds a root, and client B's `root.list` sees exactly one. The daemon-side half of `observe identical state`, over a real socket. It is ONE mutation read back, not concurrent mutation, and both clients are IPC clients rather than a CLI and a UI"

[[ac.evidence]]
package = "shepherd-daemon"
test = "roots_can_be_added_listed_and_removed"
proves = "PARTIAL — the mutation surface a second observer would be observing actually works: add, list and remove round-trip through the daemon. Cited because state that cannot change cannot be observed to change identically, and because `root.remove` was until now exercised by a passing test that no AC or guard named"

[[ac.evidence]]
package = "shepherd-daemon"
test = "the_daemon_handshakes_and_reports_status"
proves = "PARTIAL — the handshake completes and `status` returns a real answer rather than a stub. §8.2 maps `version handshake accept/reject` to AC-60/61; this is the accept leg, and it was the only test covering `status` that nothing cited"

[[ac.evidence]]
package = "shepherd-daemon"
test = "shepctl_drives_a_real_daemon_end_to_end"
proves = "PARTIAL — the CLI half of `CLI and UI`: the real `shepctl` binary drives a real daemon over a real socket, so the client side of the parity claim is a shipped binary rather than an in-process shortcut"

[[ac]]
id = "AC-61"
owning_gate = "8"
exercises = ["ui", "shepherd-cli", "shepherd-daemon"]
note = "same defect as AC-60; evidence recorded early for the same reason"

[[ac.evidence]]
package = "shepherd-daemon"
test = "shepherdd_doctor_works_with_no_daemon_running"
proves = "PARTIAL — with SHEPHERD_SOCKET pointed at a path nothing listens on, `shepherdd doctor` still runs, still reports the lingering check, mentions the daemon, and exits 0. Proves daemon-down is a warning and not a crash; proves nothing about the three things §9 requires the message to name"

[[ac.evidence]]
package = "shepherd-daemon"
test = "a_major_version_mismatch_is_rejected_with_both_versions_named"
proves = "PARTIAL — the adjacent failure mode, and the property AC-61 is really about: a rejection whose message names BOTH versions rather than saying `incompatible`. §8.2 maps handshake accept/reject to AC-60/61. This is skew rather than daemon-down, so it is evidence for the message-quality clause and not for the daemon-down clause"

[[ac.evidence]]
package = "shepherd-daemon"
test = "a_connection_that_skips_the_handshake_is_refused"
proves = "PARTIAL — the reject leg of §8.2's handshake row: a client that never said hello is refused rather than served, so the protocol's precondition is enforced rather than assumed"

[[ac.evidence]]
package = "shepherd-daemon"
test = "shepherdd_doctor_works_with_no_daemon_running"
proves = "all four things AC-61 requires, as four independent assertions rather than substring checks for the word daemon: the exact socket path tried, the resolved service-unit path with its registration state, a pasteable start command, and the exit code asserted as the specific stable value 0 across repeated invocations and distinct from 1 on a genuine failure. Registration state was the real gap — the message named the other two already"

[[ac.evidence]]
package = "shepherd-daemon"
test = "shepherdd_doctor_reports_the_daemon_as_registered_when_a_unit_file_exists"
proves = "the registration line is load-bearing rather than fixed text: writing a real unit file at an independently-computed path flips the message to registered and flips the remediation to the real service-manager start command, so the check reads actual filesystem state"

[[ac.evidence]]
package = "shepherd-daemon"
test = "an_unqualified_shepctl_reaches_a_daemon_configured_by_state_dir"
proves = """
the daemon was LISTENING and every unqualified `shepctl` reported it
unreachable (exit 3): `Paths::resolve` puts the socket under a configured
`XDG_STATE_HOME`/`SHEPHERD_STATE_DIR`, and the client only ever tried
`$HOME/.local/state/shepherd/daemon.sock`. Fixed by MOVING `paths` to
`shepherd-obs` rather than adding a cli->daemon edge, which
`shepherd-cli/Cargo.toml` refuses by design (it would drag a bundled SQLite into
a CLI needing none — verified still absent: `cargo tree -p shepherd-cli | grep
-c rusqlite` is 0). Agreement is an INVARIANT over the whole env matrix —
`socket_candidates(env)[0] == Paths::resolve(env).socket`, with a `checked == 28`
guard so the sweep cannot pass by skipping — so drift is impossible rather than
detected. The test asserts the socket file exists before it runs the client.
"""

[[ac.evidence]]
package = "shepherd-daemon"
test = "shepctl_still_reports_unreachable_when_no_daemon_is_listening"
proves = "the acceptance direction, and AC-61's own clause: pointed at a state dir with no daemon, exit 3 still happens and the hint still names the exact path tried"

[[ac.evidence]]
package = "shepherd-obs"
test = "paths::tests::an_explicit_socket_override_is_the_only_candidate"
proves = """
A REGRESSION FROM THE PREVIOUS ROUND'S OWN FIX. `socket_candidates` was
made a LIST so a client could find a daemon configured through XDG_STATE_HOME;
that is right for environment skew and wrong for an explicit override. With
`SHEPHERD_SOCKET` set but momentarily unavailable, the client fell through to the
defaults and could send a DESTRUCTIVE command to a different running daemon and
catalog. The function's own comment already said an override should be
definitive — code contradicting its own doc, again.

Asserted as EQUALITY, not `first()`: the defect lived entirely in what came
after the first entry, so a `first()` assertion would have passed throughout.
"""

[[ac.evidence]]
package = "shepherd-obs"
test = "paths::tests::an_explicit_socket_is_a_candidate_even_when_nothing_else_is_named"
proves = "a SECOND bug the finding did not name, found by hoisting the check: `env -i SHEPHERD_SOCKET=/tmp/x.sock shepctl` returned `[]` — the user names a socket and is told nothing was tried. Arguably worse than the reported fall-through, which at least attempts something"

[[ac.evidence]]
package = "shepherd-obs"
test = "paths::tests::without_an_override_the_other_rungs_are_still_tried"
proves = "the acceptance direction, and it catches the plausible over-fix: `collapse to one candidate always` satisfies both rows above and re-breaks the environment skew this function exists for. Three tests die on it"

