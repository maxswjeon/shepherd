[[guard]]
id = "G-1-ATIME"
owning_gate = "1"
exercises = ["shepherd-catalog::atime", "shepherd-rules::match"]
note = "§9: `atime_mode detection correct on all three platforms`"
evidence_missing = """
THE TWO MISSING PLATFORMS ARE IMPLEMENTED AND VERIFIED ON REAL HARDWARE. THE \
DETECTOR STILL HAS NO TEST. This row previously read `one platform, and not \
the detector`; the first half is closed and the second is not.

CLOSED. macOS and Windows no longer return Unknown by default. macOS \
`detect()` reads `statfs` flags; the no-flag case was PROBED rather than \
assumed, on a real APFS volume — atime backdated to 2020, one read advanced \
it, a second read 3s later did not — which is Linux `relatime` semantics, so \
the default maps to `Relatime` and not to `Reliable`. Windows `detect()` reads \
`NtfsDisableLastAccessUpdate`, which has FOUR states, not the two \
`learn.microsoft.com` documents; the table was transcribed from `fsutil \
behavior set disablelastaccess` on the host, and the host's own registry value \
`0x80000003` carries a flag bit `fsutil` does not print. State `2` \
(system-managed, and the Windows DEFAULT) maps to `Unknown` deliberately: \
`detect()` has exactly one production call site, is persisted and read back, \
and is NEVER REFRESHED, so in system-managed mode the OS can flip the policy \
with nobody re-running it — the optimistic mapping would silently authorise \
destructive age rules fleet-wide. The mapping is an explicit allowlist rather \
than a `& 1` mask, and a test fails if someone swaps it for a mask.

STILL MISSING, and it is precisely the half the original row named first: \
`atime::detect()` HAS NO TEST ON LINUX. macOS now covers it directly \
(`detect_answers_a_real_volume_instead_of_unknown`, plus \
`a_path_that_does_not_exist_is_unknown_not_a_guess` for the fail-closed path) \
and Windows covers the real host registry value \
(`the_probe_hosts_real_registry_value_reads_as_disabled`). But on LINUX, where \
`detect()` parses /proc/self/mountinfo and where every other atime assertion in \
this workspace runs, the detector itself is still asserted by nothing — the \
Linux tests all drive the classifier over supplied strings.

So `correct on all three platforms` is now true of the classification on all \
three and of the detector on two. The platform with the most coverage of \
everything else has the least of this.
"""

