[[ac.evidence]]
package = "shepherd-scan"
test = "walk::tests::a_denied_absolute_prefix_as_the_root_is_refused_without_being_opened"
proves = "the guard runs BEFORE `read_dir`, which is load-bearing twice over: fail-closed, and it makes `/Library/Caches` testable on Linux where the path does not exist. The pre-fix failure shows why placement matters — a guard after the open reports `Unreadable`, not `Denied`"

[[ac.evidence]]
package = "shepherd-scan"
test = "walk::tests::a_symlinked_root_pointing_at_a_denied_tree_is_refused"
proves = """
the same finding, still reachable after the first fix: an innocent link
name pointing at a denied tree walked it, because `root.file_name()` reads the
LINK's name and `read_dir` follows a symlinked root. Closed by deny-checking the
canonicalized target as well.

SCOPED TO SYMLINKED ROOTS DELIBERATELY, on measurement rather than taste.
Canonicalizing unconditionally breaks macOS blind: `env::temp_dir()` there is
`/var/folders/...`, which canonicalizes to `/private/var/...` — a denied
absolute prefix — refusing the roots of two existing tests on a platform this
gate cannot run. And it would not close the symlinked-ANCESTOR case anyway,
because `deny_dir` matches on the final component only. A sliver of extra
coverage at that cost.

The root is the SOLE symlink this walker follows — every symlinked directory
inside a walk is `Skip::SymlinkedDir` — so it is the sole link whose target
needs checking. This completes the existing no-symlink doctrine rather than
adding a second one.
"""

[[ac.evidence]]
package = "shepherd-scan"
test = "walk::tests::a_symlinked_root_that_will_not_resolve_is_reported_not_walked"
proves = "`canonicalize` failing yields `Skip::Unreadable` rather than falling through — `read_dir` can still succeed after `canonicalize` fails, and falling through would leave a window where the walk proceeds on a deny check that never ran. That window is the shape of half this review's findings, closed before it existed"

[[ac.evidence]]
package = "shepherd-scan"
test = "walk::tests::an_innocent_symlinked_root_still_walks"
proves = """
the acceptance direction, and it is the only test that dies under
`refuse every symlinked root` — the plausible over-fix, which would break
registering `/home/me/data -> /mnt/big/data`. Also asserts `rel_path` stays
relative to the LINK, pinning that canonicalization is for the deny decision
only and never redefines the walk root.

STATED RESIDUAL: a root reached through a symlinked ANCESTOR still walks.
Unconditional canonicalization does not close it either; only a component-wise
check of every canonical component would, which is a wider policy decision than
this finding. Strictly smaller than the hole closed, documented at `deny_root`.
"""

[[ac.evidence]]
package = "shepherd-daemon"
test = "a_denied_root_is_refused_before_any_probe_writes_into_it"
proves = """
THE DENY PROMISE WAS BROKEN BY THE REGISTRATION PATH ITSELF.
`root_add` called `probe_path_policies` and `detect_with_write_probe` — both of
which WRITE FILES INTO THE ROOT — before anything consulted the deny list. So
`root.add <repo>/.git` wrote Shepherd's probe files into a tree the policy says
is never touched, and only afterwards did a scan decline to walk it. Not a
missing error message: a write into a directory the user never agreed to have
written to.

THE ASSERTION IS THE DIRECTORY'S MTIME, PINNED WITH `File::set_times`, AND THAT
MATTERS. The obvious test — assert the directory is empty — PASSES WITH THE
TRESPASS FULLY IN PLACE, because both probes clean up after themselves
(`ProbeFiles` unlinks on `Drop`, `probe_atime_advance` unlinks immediately). An
mtime bumps on create AND on remove, so it is the version that can fail.

MUTATION 2 IS THE PROOF: move the refusal to AFTER the probes and the message
test STILL PASSES — same `Refused` code, same `version-control` reason — while
only the mtime assertion dies. The defect was ordering, and a message test
cannot see ordering.
"""

[[ac.evidence]]
package = "shepherd-daemon"
test = "a_denied_root_refusal_names_the_rule_that_refused_it"
proves = "two distinct DenyReason routes — exact name to `version-control`, foreign-sync name to `foreign-sync-root` — so the operator can tell which rule refused them. `ErrorCode::Refused` rather than `Invalid` because `error.rs:133` names `a deny-list entry` verbatim in Refused's own definition, and because a built-in list nothing in the request can change ought to be non-retryable"

[[ac.evidence]]
package = "shepherd-daemon"
test = "a_substring_is_not_a_component_at_registration"
proves = "round 1's component rule re-tested at the new boundary: `mygit`, `.gitignore` and `my_node_modules` all still register. Registration and scan both go through `DenyList::builtin()` and `deny_dir`, so the two cannot reach different conclusions about what is denied — by construction, not by a test that they agree"

[[ac.evidence]]
package = "shepherd-daemon"
test = "an_ordinary_root_still_registers_with_its_probes_run_and_its_policies_recorded"
proves = """
the acceptance direction as an exact inversion: mtime CHANGED (the
probes ran), no `could not probe` warning, and `root.list` reports the same
case/norm/atime policies `root.add` answered with. `refuse everything` would
disable enrollment entirely while passing both refusal rows above.

FOLLOW-UP RECORDED: this call site mirrors the walker's uncanonicalized check,
so a root with an innocent name symlinking to a denied tree still reaches the
probes here. The walker refuses it, so the promise holds and the error merely
arrives late; adopting the walker's symlink rule at registration is the open
item.
"""

