# AC -> machinery mapping consumed by `cargo xtask gate --audit` (§9 rule 6).
#
# PROVENANCE, stated plainly because §9 rule 6 exists to stop this being
# misrepresented: the rows below were transcribed BY HAND from the plan's
# Appendix (`Exercises (primary)` column) and §6's per-phase creates-lists.
# They are not tool output. What IS tool output is the audit that consumes them:
# `xtask gate --audit` re-derives the owned-too-early invariant from this file
# on every CI run.
#
# The Appendix says its own `Exercises` column is "abbreviated to the primary
# crate" and that "the full mapping lives in xtask/ac-map.toml". This file is
# therefore SEEDED from that abbreviated column and enriched to module
# granularity only where §6 splits a crate across phases — which it does for
# shepherd-rules (match->1, engine/preview/delete_policy->2, suggest->5),
# shepherd-placeholder (provider/delete_mode/mock->2, cfapi/fileprovider->3),
# shepherd-jobs (queue/worker->1, cron/catchup/gate/adaptive->4),
# shepherd-index (meta->1, ann/hybrid/rrf->5) and shepherd-storage
# (adapter/s3/multipart/transfer_session/replica->2, azure/graph/drive/nas->6).
# Without that split the invariant would pass vacuously for exactly the ACs
# whose mis-assignment two independent critics found.
#
# Further module-level enrichment is owned by the phase that creates the module:
# when a phase lands machinery, it adds the entry here in the same change.

phase_order = ["0a", "0b", "0c", "0d", "1", "2", "3", "4", "5", "6", "7", "8", "9"]
expected_ac_count = 65

# ---------------------------------------------------------------------------
# CLOSED — `gate --phase 1` PASSED while Phase 1 was NOT done.
# ---------------------------------------------------------------------------
#
# Kept because the shape of the defect is worth more than the fix. Only TWO ACs
# carried `owning_gate = "1"` (AC-13, AC-56); both were properly backed by
# evidence that ran, so `gate --phase 1` reported PASS. §9's Phase 1 row demands
# ten further things — both M1 legs, AC-54's CI check, the identity layer,
# `atime_mode` on three platforms, the job-queue core, catalog write discipline,
# and daemon installation on Linux and macOS — and **none of them was encoded
# here, so the gate could not ask for them.** Nothing lied. The gate answered
# the question it was given, and the question was a proper subset of §9's.
#
# This was the vacuous pass `gate --audit`'s own closing NOTE says it cannot
# catch: it detects owned-too-early only, and "an AC owned late enough to
# compile but too early to be non-trivial" was left as a human review property.
# The limit was reached in practice, at Phase 1.
#
# WHAT CHANGED
#
# 1. Every clause of §9's Phase 1 row is now encoded — as `[[guard]]` rows
#    (§9's prose demands carry no AC number, and the numbered AC-1..AC-65 set is
#    fixed by the Appendix, which `gate --audit` enforces exactly-once) and as
#    `[[phase]]` requirement rows that quote §9 verbatim.
# 2. `xtask/src/phase_completeness.rs` reconciles this file against §9's gate
#    table on every `gate --audit`, and `gate --phase <id>` now FAILS on any
#    clause of its own §9 row that nothing here claims. A phase can no longer
#    be under-specified silently: it can only be under-specified loudly.
# 3. Phase 0 had no gate at all — §9 names `gate --phase 0ab`, which matched no
#    id here, so `--phase 0a` exited 2. The `[alias]` table below joins §9's
#    compound gate ids to this file's atomic phases, and 0a/0b/0c/0d now own
#    guards. Several are RED, which is the correct report.
#
# The result is that `gate --phase 1` is now RED and says why. That is the
# outcome: a gate that reports the phase unfinished is worth more than one that
# reports it finished on a subset nobody chose deliberately.

# ---------------------------------------------------------------------------
# [alias] — §9's gate command ids -> the phases in `phase_order` they cover.
# ---------------------------------------------------------------------------
#
# §9's table names `xtask gate --phase 0ab`, `--phase 0cd` and, for Phase 9,
# `xtask gate --release`. None of the three matched an id here, so three of §9's
# eleven gate commands could not be run at all — and the two Phase-0 ones failed
# with "no acceptance criteria are owned by phase `0a`", which is the gate
# correctly refusing to report a vacuous pass over an empty set. That refusal is
# how this was found.
#
# The join lives here rather than in `phase_order` because `gate --audit`'s
# owned-no-earlier-than invariant needs a TOTAL ORDER over phases, and `0ab` has
# no position in one: it is not after `0a` and not before `0b`, it *is* both.
# Aliasing keeps the ordering exact and makes every command §9 names runnable.
[alias]
"0ab" = ["0a", "0b"]
"0cd" = ["0c", "0d"]
"release" = ["9"]

