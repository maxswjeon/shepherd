# Phase 0 guards — the gate §9 names and this file did not have.
# ---------------------------------------------------------------------------
#
# §9's Phase 0 rows demand artifacts and decisions, not numbered ACs, so they
# are guards: "release-blocking but not numbered spec ACs", audited by the same
# invariant and excluded from the AC-1..AC-65 completeness check. Inventing
# AC-66 for them would break that check and misrepresent the Appendix, which
# fixes the AC set at 65.

[[guard]]
id = "G-0A-CI"
owning_gate = "0a"
exercises = ["ci"]
note = "§9: `Workspace CI green on all three platforms`"
evidence_missing = """
DECLARED, NOT GREEN. The three-platform matrix is declared in ci.yml and the \
cited test asserts it is still declared — an edit dropping windows-latest or \
macos-latest fails here. Whether a RUN was green on those platforms is a \
property of a CI run, not of this repository, and no test in a repository can \
assert it. .omc/artifacts/phase-0a/verification.md records plainly that no \
Windows or macOS leg has ever executed. So what is proven is the matrix; what \
§9 asks for is the result, and the honest gap is the difference.\
"""

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::ci_declares_all_three_platforms"
proves = "the CI matrix still names ubuntu-latest, windows-latest and macos-latest — a silent narrowing to Linux-only would otherwise leave the §9 clause reading as satisfied"

[[guard]]
id = "G-0B-BARS"
owning_gate = "0b"
exercises = ["shepherd-bench", "xtask::evidence_artifacts"]
note = """
§9: `bench-baseline.json with metadata p95, vector p95 and index RSS at 10M \
within bars`. The bars were met, so §9's alternative closure path — a written \
escalation carrying the user's recorded renegotiation decision — was not \
needed for THIS clause. On what a gate can and cannot assert about a recorded \
decision, see G-0B-CAPACITY.\
"""

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::the_recorded_metadata_p95_clears_the_precommitted_bar_in_both_cache_states"
proves = "the recorded metadata p95 (23.48 ms cold, 22.20 ms warm) clears the bar that bench-contract.toml FIXED BEFORE THE RUN, in both cache states, over the contract's row count — and the bar in the artifact is checked against the bar in the contract, so moving one to fit the other fails here rather than passing quietly"

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::the_adr_names_the_only_candidate_that_actually_passed"
proves = "the written index decision is backed by its own evidence: exactly one candidate clears the bar in both cache states, which is what makes the ADR's claim of `no tie to break` true, and the ADR names that candidate. A re-measure that promoted another candidate would fail here instead of leaving the ADR asserting a superseded conclusion"

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::every_ann_cell_that_ran_at_full_scale_fits_the_ac46_band"
proves = "every ANN cell measured at the contract's full vector count sits inside AC-46's 4-16 GiB band and under the 300 ms bar, and a cell that ran at reduced scale must carry a recorded reason rather than pass as though it had not. Includes a count assertion: a filter matching no cells would satisfy every other line in the test"

[[guard]]
id = "G-0B-CONTRACT"
owning_gate = "0b"
exercises = ["shepherd-bench", "xtask::evidence_artifacts"]
note = "§9: the precommitted numeric workload contract, fixed BEFORE 0b runs"

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::the_recorded_run_matches_the_precommitted_workload_contract"
proves = "the run that produced the numbers used the concurrency, run count, per-run query count and background ingest the contract fixed. A p95 measured with one idle client is a different number wearing the same name, and this is what stops it being reported as the same one"

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::the_contract_still_scores_every_axis_the_tiebreak_rule_names"
proves = "the tiebreak rule still scores all five axes, including the three (persistence, crash-consistency, cold-start rebuild) added because latency-and-RSS alone would have selected differently. Losing them would let the decision be re-derived on the two axes it was corrected away from"

[[guard]]
id = "G-0B-CAPACITY"
owning_gate = "0b"
exercises = ["shepherd-bench"]
note = "§9: the 50 TB capacity model's explicit reject thresholds"
evidence_missing = """
A THRESHOLD IS BREACHED AND ITS ESCALATION IS OPEN. §9 requires each axis of \
the capacity model — DB growth, checkpoint size, scrub request/egress cost, \
restart time, transfer duration — to carry a fail bound rather than being \
measured-or-extrapolated. Scrub cost BREACHES its bound: E-3 records $441/mo \
on S3 Standard against a $25 threshold, ~18x over, and it is an OPEN user \
decision in .omc/plans/open-questions.md, not a resolved one. §9's Phase 0 row \
permits closure by `a written escalation carrying the user's recorded \
renegotiation decision`, and E-3 is written but NOT decided.

ON WHAT A GATE CAN ASSERT ABOUT A RECORDED DECISION, since §9 makes one a \
closure path: it can assert that a decision exists, that it is well-formed, \
and that the numbers it cites agree with the artifact it claims to be about — \
all three fail loudly on a stale or unbacked record. It CANNOT assert that the \
user made it. Provenance of consent is not a property of a file, and a test \
that read `- [x] RESOLVED by the user` would be asserting the presence of a \
string any editor can type. So this row states the gap rather than encoding a \
check that would read as proof of a decision while proving only that someone \
wrote one down.\
"""

