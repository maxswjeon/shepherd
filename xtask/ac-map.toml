[[ac.evidence]]
package = "shepherd-tier"
test = "destroy::tests::the_happy_path_destroys_and_audits"
proves = "the intent journal and audit record are written for a destruction"

[[ac.evidence]]
package = "shepherd-catalog"
test = "intent::tests::a_premature_commit_is_refused_and_the_row_stays_unresolved"
proves = """
the guard rejected a transition only once the source was ALREADY
SETTLED, so `Prepared -> CatalogCommitted` was accepted: an intent could report
the destruction protocol complete having skipped the syscall and the audit
entirely. `transition` now checks an explicit `successors()` edge list.

STATED CAREFULLY, because the consequence is latent: nothing in this workspace
calls `unresolved()` or `needs_recovery()` — there is no startup consumer, so no
run is rescued or lost by this today. What this asserts is the JOURNAL-LEVEL
fact — the refusal happens, the row does not move, it is still in the set
`unresolved()` reports — and not a runtime outcome. See the open review thread
on `intent.rs:260`.
"""

[[ac.evidence]]
package = "shepherd-catalog"
test = "intent::tests::a_destruction_that_already_happened_can_never_report_itself_aborted"
proves = """
the principle the edge list is derived from, decided in review because
the repo has no §4.4 state table: `aborted` is a claim about the FILE, not about
the code path — it must mean positive evidence the file was not destroyed. A
state only reachable after the syscall fired therefore cannot reach it, or a
SETTLED row claims the file is intact when it is already gone. Also asserts the
one edge it does have still works, so this cannot be satisfied by stranding the
state
"""

[[ac.evidence]]
package = "shepherd-catalog"
test = "intent::tests::an_unresolved_outcome_cannot_be_reconstructed_until_it_is_resolved"
proves = "you cannot reconstruct an audit record of an event you cannot describe — reconstruction presupposes a known outcome, so the route runs through `OutcomeKnown`. Asserts the working route too"

[[ac.evidence]]
package = "shepherd-catalog"
test = "intent::tests::re_asserting_a_state_is_refused_and_says_so_by_type"
proves = """
self-transitions are refused. The old `current.is_settled() && current != to`
permitted them by ACCIDENT, and the accident points the wrong way:
`CatalogCommitted -> CatalogCommitted` is harmless but `SyscallIssued ->
SyscallIssued` means the irreversible syscall was issued twice — precisely the
event a journal exists to make visible. Refused by TYPE (`CatalogError::AlreadyInState`)
rather than by message, so a crash-retry can skip without string matching; pins
both directions, because a caller skipping on `AlreadyInState` must not skip
past a real violation
"""

[[ac.evidence]]
package = "shepherd-catalog"
test = "intent::tests::transition_accepts_exactly_the_declared_lifecycle"
proves = "the 8x8 sweep: every legal pair accepted, every illegal pair refused, and a refused move leaves the row's state untouched. It caught the self-transition change by itself when the oracle was flipped — the acceptance direction, since `refuse everything` takes 8 of 13 tests with it"

