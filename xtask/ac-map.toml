[[guard]]
id = "G-1-CHECKPOINT"
owning_gate = "1"
exercises = ["shepherd-catalog::schema"]
note = """
§9: `single-writer actor, dedicated PASSIVE-checkpoint connection`; E-4 sharpens it to WAL bounded across the full 10M scan. Both halves are cited below. READ THEM AS TWO SEPARATE CLAIMS: the first proves the WAL is bounded, the second proves a dedicated connection checkpoints. NEITHER proves the dedicated connection is what BOUNDS the WAL — and the measurements say it does not. `crate::PRAGMAS` (lib.rs:81) sets journal_mode / foreign_keys / synchronous / busy_timeout and never disables `wal_autocheckpoint`, so SQLite's own page-count checkpoint is armed on the writer's connection throughout. (`writer.rs:489` does disable it, but that line is inside `#[cfg(test)]` — it exists so the structural test below can attribute backfill to the dedicated thread, and it is the one place it must be off for a test to be valid. Production runs with it armed.)
"""
evidence_missing = """
BOTH HALVES ARE NOW CITED; WHAT REMAINS IS AN ATTRIBUTION, NOT A GAP IN EITHER. \
E-4's demand — the WAL bounded across the FULL 10M scan — is met at 10,000,000 \
files on a sampled maximum. The structural claim §9 makes — a DEDICATED \
connection — is met by a test that a PASSIVE checkpoint on the writer's own \
connection fails.

What no evidence establishes is that the dedicated connection is what BOUNDS \
the log, and the run's own numbers say it is not. `crate::PRAGMAS` never \
disables `wal_autocheckpoint`, so SQLite's default page-count checkpoint is \
armed on the writer's connection for the whole scan. At the measured write rate \
(4,513 MiB of catalog over a 1,882 s upsert = 2.40 MiB/s, itself a lower bound \
on bytes entering the log) a checkpointer running only every 30 s would have to \
let the WAL hold ~72 MiB between ticks — six times the observed 11.30 MiB, and \
past the 64 MiB ceiling this row asserts.

A controlled re-run over the same corpus on an unloaded box wrote 14.4 % faster \
and produced a high-water of 10.84 MiB against the loaded run's 11.30 MiB — a \
faster writer with a SMALLER log. A checkpointer running only on a 30 s period \
would have produced a proportionally LARGER one. The bound does not come from \
the dedicated thread. That second reading is a post-mortem file size rather \
than a sampled series, and it is a HIGH-WATER MARK for the same reason the \
series has no drops: a PASSIVE checkpoint backfills and reuses the log in place, \
`journal_size_limit` is unset, and nothing issues TRUNCATE or RESTART, so the \
file is monotonically non-decreasing for the daemon's life. The idle run also \
covers MORE writing than the loaded one (5,645,500 rows against 4,937,000 at the \
same elapsed time), which makes the comparison conservative rather than merely \
favourable — and it retires the worry that the loaded run's bound passed because \
contention gave the checkpointer slack. The loaded figure is the more \
conservative of the two.

The WAL file cannot settle this by sampling. Because the log is reused in place \
rather than truncated, the size series has no drops at any resolution — across \
the whole 10M scan, ZERO. Anyone tempted to close this by looking harder at the \
samples should stop; the honest closes are to disable `wal_autocheckpoint` in \
PRAGMAS and re-measure, or to accept the two claims as the separate things they \
are.\
"""


[[guard.evidence]]
package = "shepherd-daemon"
test = "the_m1_demo_holds_at_a_million_files"
ignored = true
requires_env = "SHEPHERD_M1_CORPUS"
release = true
proves = "the WAL BOUND across the FULL 10,000,000-file scan E-4 named, at the scale E-4 named. SAMPLED throughout — 2,066 readings at 1 s — and asserted on the MAXIMUM of the series rather than a final reading, which is the distinction that makes it evidence: a WAL that grew without bound and was checkpointed once at the end satisfies a closing measurement and fails this. Peak 11.30 MiB against the 64 MiB ceiling, first reached at t=633 s and then FLAT AT THAT MAXIMUM for the remaining 69 percent of the scan while ~6.9M further rows landed and the catalog grew to 4,513 MiB — the log held 0.25 percent of what it wrote. wal_max == wal_final is that plateau and NOT a still-growing log: a PASSIVE checkpoint backfills and SQLite reuses the log in place, so the file records a high-water mark and never shrinks. Daemon VmHWM 2,498 MiB, the Vec<FileStat> ceiling scan_exec.rs names 10M as the pressure point for, holding with room. What this does NOT establish is WHICH mechanism bounds it — see the note on this row. The scan_seconds / rescan_seconds / scan_files_per_sec figures in the artifact were taken on a contended box and the test already refuses to let them mean anything"

[[guard.evidence]]
package = "shepherd-catalog"
test = "writer::tests::the_checkpoint_lands_on_a_connection_the_writer_thread_does_not_own"
proves = "the STRUCTURAL half of §9's clause: that the connection issuing the checkpoint is a DISTINCT connection from the writer's. It is not a grep for wal_checkpoint and not a count of checkpoint calls — the call can be present, be issued, and the WAL still grow without bound. It measures an outcome only a separate connection can produce. The writer thread is put to sleep INSIDE a closure and a probe task submitted afterwards is asserted NOT to have completed, so the writer's connection is provably idle for the window; wal_autocheckpoint is disabled on the writer's connection and READ BACK as 0, so SQLite's own checkpointer cannot account for the result; and in WAL mode the main database file grows only when frames are backfilled. Growth in that window is therefore a checkpoint on a connection the writer thread was not touching. A second leg runs the identical window with checkpoint_path None and requires growth == 0, so the measurement has a control rather than a bare number. BOTH LEGS ARE MUTATION-PROVEN. Moving the checkpoint onto the WRITER'S OWN connection through the actor — same PRAGMA wal_checkpoint, same PASSIVE, same timer, indistinguishable to a grep — fails it. Giving the control leg a checkpoint thread also fails it. What this does NOT prove is the MODE: nothing asserts PASSIVE rather than TRUNCATE or RESTART"

