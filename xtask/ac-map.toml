# AC -> machinery mapping consumed by `cargo xtask gate --audit` (§9 rule 6).
#
# PROVENANCE, stated plainly because §9 rule 6 exists to stop this being
# misrepresented: the rows below were transcribed BY HAND from the plan's
# Appendix (`Exercises (primary)` column) and §6's per-phase creates-lists.
# They are not tool output. What IS tool output is the audit that consumes them:
# `xtask gate --audit` re-derives the owned-too-early invariant from this file
# on every CI run.
#
# The Appendix says its own `Exercises` column is "abbreviated to the primary
# crate" and that "the full mapping lives in xtask/ac-map.toml". This file is
# therefore SEEDED from that abbreviated column and enriched to module
# granularity only where §6 splits a crate across phases — which it does for
# shepherd-rules (match->1, engine/preview/delete_policy->2, suggest->5),
# shepherd-placeholder (provider/delete_mode/mock->2, cfapi/fileprovider->3),
# shepherd-jobs (queue/worker->1, cron/catchup/gate/adaptive->4),
# shepherd-index (meta->1, ann/hybrid/rrf->5) and shepherd-storage
# (adapter/s3/multipart/transfer_session/replica->2, azure/graph/drive/nas->6).
# Without that split the invariant would pass vacuously for exactly the ACs
# whose mis-assignment two independent critics found.
#
# Further module-level enrichment is owned by the phase that creates the module:
# when a phase lands machinery, it adds the entry here in the same change.

phase_order = ["0a", "0b", "0c", "0d", "1", "2", "3", "4", "5", "6", "7", "8", "9"]
expected_ac_count = 65

# ---------------------------------------------------------------------------
# KNOWN GAP — `gate --phase 1` PASSES while Phase 1 is NOT done.
# ---------------------------------------------------------------------------
#
# Only TWO ACs carry `owning_gate = "1"` (AC-13, AC-56). Both are now backed by
# evidence that runs, so the gate reports PASS. §9's Phase 1 row demands
# considerably more, and none of it is encoded here as a phase-1-owned AC:
#
#   * M1 both legs — the functional pipeline over a 1M-file ON-DISK corpus, and
#     the < 50 ms p95 over a 10M-row injected catalog. The index leg is measured
#     (14.66 ms p95 at 10M, 0dab668) but is an #[ignore]d bench, not gate
#     evidence; the functional leg's largest run is the daemon e2e at NINE
#     entries.
#   * AC-54's `CLI == registered_methods` running in CI from this phase.
#   * The identity layer: content-addressed keys collision-free under a
#     case/normalisation fuzz corpus, and `fs_id` stable across a simulated
#     remount.
#   * `atime_mode` detection correct on all three platforms.
#   * Job-queue core: kill-and-resume of a checkpointed job. (A test exists —
#     `kill_and_resume_of_a_checkpointed_job` — it is simply not cited here.)
#   * Catalog write discipline: single-writer actor and dedicated PASSIVE
#     checkpoint connection. (Tests exist —
#     `concurrent_writers_over_one_file_serialize` and the contention pair in
#     `session_store_tests.rs` — also not cited here.)
#   * Daemon installation on Linux (systemd user unit, lingering checked and
#     warned, never forced) and macOS (LaunchAgent).
#
# **This is the vacuous pass `gate --audit` states it cannot catch.** Its own
# closing NOTE says it detects owned-too-early only, and that "an AC owned late
# enough to compile but too early to be non-trivial" stays a human review
# property. That limit has now been reached in practice, at Phase 1.
#
# So: a PASS from `gate --phase 1` currently means "AC-13 and AC-56 hold", NOT
# "Phase 1 is done". Several of the missing items ALREADY HAVE PASSING TESTS and
# need only citing; others (the 1M corpus, the three-platform atime check, the
# macOS LaunchAgent) need machinery or hardware this run did not have.
#
# The structural fix is a phase-completeness check that reconciles this file
# against §9's per-phase rows, so a phase cannot be under-specified silently.
# Deliberately NOT added in the same pass that discovered the gap — a checker
# written by the person whose omission it is auditing, at the end of a run, is
# how the next vacuous pass gets built.

