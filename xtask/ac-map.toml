[[guard]]
id = "G-0B-CONTRACT"
owning_gate = "0b"
exercises = ["shepherd-bench", "xtask::evidence_artifacts"]
note = """
§9: the precommitted numeric workload contract, fixed BEFORE 0b runs.

TWO THINGS A READER OF THE ROWS BELOW MUST KNOW, recorded here now that \
`gate --phase` renders notes at all — it silently dropped every one of them \
until 2026-08-19, which is why this was never written down before.

1. `background_ingest` HAD NO PRODUCER FOR THE WHOLE OF PHASES 0b-1. \
`bench-contract.toml:181` fixes `background_ingest = true` and \
`background_ingest_rows_per_sec = 2_000`; `shepherd-bench/src/main.rs:148` \
parses both into `Execution`; and until 2026-08-19 NOTHING READ EITHER — zero \
consumers in the tree. The writer lived in `meta_bench.rs`, which `ccbc26d` \
deleted along with the losing bake-off candidates. So the evidence row below \
that says the 0b run `used ... background ingest the contract fixed` is TRUE \
OF THE RECORDED RUN AND NOT REPRODUCIBLE: the code that produced those numbers \
is gone. Two workers found this independently. \
`xtask/src/evidence_artifacts.rs:167` asserts `background_rows_ingested > 0`, \
which passes honestly — but it reads `bench-baseline.json`, A RECORDED \
ARTIFACT, not a live run, so it says nothing whatever about present \
capability. Do not read it as proof the workload can be reproduced. The Phase 1 \
`G-1-M1-PERF` harness is the first thing in the tree ever to implement it.

2. THE CONTRACT WAS UNLOADABLE FROM 2026-08-16 UNTIL 2026-08-19. `46b84ab` \
added `tantivy = "0.26.1"` to `[reference_machine]` together with the matching \
struct field; `ccbc26d` deleted the struct field and left the contract line. \
`Contract` is `#[serde(deny_unknown_fields)]`, so EVERY command that loads this \
file — `gen-trace`, `gen-catalog`, `capacity`, and all three ANN legs — died on \
a parse error for three days. `ccbc26d`'s commit message carries a `Verified:` \
block with six green lines, every one of them from `smoke`, which is the ONE \
command that takes no contract. The verification could not have failed the way \
the change broke things. Repaired by restoring `tantivy` as `Option<String>` to \
the struct, NOT by trimming the contract line: this file is a precommitted \
provenance record, `bench-baseline.json` still carries \
`meta_bench_tantivy_warm`/`_cold`, and the version those numbers were measured \
against is precisely what the contract exists to pin. Editing it would have \
altered a measurement's provenance after the fact — the failure mode this \
file's own header names.
"""

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::the_recorded_run_matches_the_precommitted_workload_contract"
proves = "the run that produced the numbers used the concurrency, run count, per-run query count and background ingest the contract fixed. A p95 measured with one idle client is a different number wearing the same name, and this is what stops it being reported as the same one"

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::the_contract_still_scores_every_axis_the_tiebreak_rule_names"
proves = "the tiebreak rule still scores all five axes, including the three (persistence, crash-consistency, cold-start rebuild) added because latency-and-RSS alone would have selected differently. Losing them would let the decision be re-derived on the two axes it was corrected away from"

[[guard]]
id = "G-0B-CAPACITY"
owning_gate = "0b"
exercises = ["shepherd-bench"]
note = "§9: the 50 TB capacity model's explicit reject thresholds"
evidence_missing = """
THE BREACH IS REAL, THE REMEDY IS DEMONSTRATED, AND THE BLOCKER IS NOW A NAMED \
ARCHITECTURE DECISION RATHER THAN MISSING EVIDENCE. This row previously read \
`a threshold is breached and its escalation is open`. The escalation is no \
longer the open part.

E-3 SETTLED and inverted: the cause was our own client, not the provider. \
`S3Adapter::head` never sent `x-amz-checksum-mode: ENABLED`, and S3 omits every \
`x-amz-checksum-*` field unless the request opts in. Real S3 and MinIO both \
return a whole-object checksum on multipart objects; there was never any \
emulator-versus-real divergence. Fixed in 680c0fa.

BOTH COST ROWS STAND, and that is the whole difficulty. No whole-object \
checksum is $441/mo — 18x the $25 bound. Checksum requested at upload is \
$0.68/mo — 37x under. 649x between them. `multipart_checksum` defaults to \
`None` and CANNOT BE RETROFITTED WITHOUT RE-UPLOADING EVERY OBJECT, so $441 \
remains correct for a default-config corpus and the axis stays breached until \
the DEFAULT changes.

WHY THE DEFAULT HAS NOT CHANGED. E-5's producer — probe at registration, adopt \
the first of CRC64NVME, CRC32C, CRC32 that round-trips — is BUILT and proven \
against a live endpoint: one genuinely two-part ~10 MiB upload per algorithm \
through the real multipart path, verdict read from HEAD rather than \
GetObjectAttributes, recording per-algorithm evidence rather than a boolean. It \
has NO PRODUCTION CALLER, because the only place it can be called is \
`target.add`, which is refused. Serving `target.add` requires an async runtime \
in `shepherd-daemon`, which today contains zero `async` and zero `tokio` and \
has no edge to `shepherd-storage`; nothing parses `TargetAddRequest::config` \
and nothing resolves `credentials_ref`. THAT IS A PHASE 2 ARCHITECTURE \
DECISION FOR THE USER, not an implementation gap, and wiring a probe onto a \
half-served `target.add` would relocate this project's own defect class from \
declared-with-no-producer to producer-with-no-consumer.

So the honest state is: the axis fails its bound under the default \
configuration; the fix is specified, implemented and demonstrated; and \
adopting it is blocked on a decision nobody has made. §9's closure path — `a \
written escalation carrying the user's recorded renegotiation decision` — is \
still available and still unexercised. The gate can assert a decision exists, \
is well-formed, and cites numbers that agree with its artifact. It cannot \
assert the user made it: provenance of consent is not a property of a file, \
and a test reading `- [x] RESOLVED` would prove only that someone typed a \
string.
"""

[[guard]]
id = "G-0C-SPIKES"
owning_gate = "0c"
exercises = ["spikes/windows-syncroot", "spikes/macos-fileprovider"]
note = "§9's 0c/0d row: Windows sync-root hydration from a separate process; the macOS spike on BOTH OQ-A mechanisms; CFAPI trash/undelete"
evidence_missing = """
BOTH SPIKES HAVE NOW RUN ON REAL HARDWARE. THE WINDOWS LEG IS GREEN. THE macOS \
LEG IS GREEN AS FAR AS REGISTRATION AND BLOCKED BEYOND IT ON G-0D. This row \
previously read `hardware, and no spike has run`; the hardware exists and the \
spikes have run.

WINDOWS — the §6 question, answered. Register/connect decoupling WORKS from \
unpackaged executables. Three distinct processes: one registered the sync root \
with `CfRegisterSyncRoot(CF_REGISTER_FLAG_NONE)` AND THEN EXITED; a second \
called `CfConnectSyncRoot` and created a 12,000-byte placeholder; a third read \
it. `CF_CALLBACK_TYPE_FETCH_DATA` fired in the second process and was served \
across the process boundary, with the reader's identity taken from the KERNEL \
via `CF_CONNECT_FLAG_REQUIRE_PROCESS_INFO` rather than from our own bookkeeping, \
and the payload confirmed by sha256 against an independently computed digest. \
Registration persists past process exit — verified from a new process a day \
later and reproduced same-boot. Named limits: REBOOT persistence is UNTESTED \
(`LastBootUpTime` predates both registrations); shell/Explorer integration is \
untested and remains the likeliest home of a real identity requirement; this \
is Server 2022, not a Win11 client. Correction of record: \
`Explorer\\SyncRootManager` is written by the shell-level WinRT \
`StorageProviderSyncRootManager` and NOT by `cfapi`, so it had zero children \
immediately after a registration that read back 1028 bytes — an earlier check \
against that key could not have failed for the right reason. The load-bearing \
check is `CfGetSyncRootInfoByPath`, which returns 0x80070186 after \
unregistration.

macOS — registration free, hydration blocked. A File Provider extension \
registers a domain under AD-HOC signing with no Apple certificate, no \
provisioning profile and no notarization, PROVIDED the appex binary is \
`MH_EXECUTE` with `_NSExtensionMain` as its entry point (codesign silently \
ignores `--entitlements` on an `MH_BUNDLE`) AND the extension is SANDBOXED — \
`pkd` refuses it otherwise with `plug-ins must be sandboxed`. The App Group \
entitlement EMBEDS and permits registration but is REJECTED AT RUNTIME under \
ad-hoc: `containermanagerd` requires group identifiers prefixed by the \
requestor's team ID and ad-hoc has none, so it verifies clean under `codesign \
-d --entitlements` and is refused in operation.

WHAT IS STILL RED, AND WHY IT IS THE USER'S EXCLUSION RATHER THAN A GAP. The \
domain is created `user-disabled` (`FP -2011`, \
`NSFileProviderErrorDomainDisabled`, decoded from the SDK header). The \
documented headless bypass is `NSFileProviderDomain.testingModes = \
.alwaysEnabled`, which requires \
`com.apple.developer.fileprovider.testing-mode`; signing that ad-hoc gets the \
process AMFI-SIGKILLed, and reverting the entitlement made the identical binary \
run again. So enabling a domain headlessly needs a GUI operator or a \
provisioned identity, and the notarized-extension leg this row names needs \
Apple Developer Program membership — both are G-0D-PROCUREMENT, which the user \
EXCLUDED from this pass. HYDRATION WAS NEVER REACHED, not attempted-and-failed: \
no `NSFileProviderReplicatedExtension` method was ever entered, so whether the \
provider would hydrate once enabled is untested rather than falsified.

The row's own Windows alternative — `a documented sparse failure plus \
full-MSIX success` — shows §9 accepts a documented conditional here, which is \
why this is recorded as partial closure naming its blocker rather than as a \
blanket red. Evidence: \
.omc/artifacts/phase-0c/windows-decoupling-and-persistence.md and \
.omc/artifacts/phase-0c/macos-hydration-findings.md.
"""

