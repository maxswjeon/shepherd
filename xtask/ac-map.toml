proves = "the negative that gives the positive meaning: absent a custody record the bytes sit in the target with nothing on the machine knowing their address."

[[ac.evidence]]
package = "shepherd-storage"
test = "replica::chain::tests::a_deleted_segment_invalidates_custody"
proves = """
a chain with intact POINTERS but a deleted SEGMENT was custody-eligible:
`read_chain` fetches pointer bodies only, so the predicate checked topology and
never proved the recovery payload exists. Custody is now an ATTESTATION rather
than a predicate — `SegmentEvidence` starts `Unchecked`, only `verify_segments`
raises it, and no hot path can mint custody by reading the chain.

WHY NOT ON THE DESTROY PATH: a snapshot segment is a compressed catalog (854 MB
at 10M files per the capacity ADR), deltas accumulate WITHOUT BOUND because v1
disables GC, and S3 egress is ~$0.09/GB PER EVALUATION. Re-downloading the
catalog to decide one file's fate costs more than the tiering saves.
"""

[[ac.evidence]]
package = "shepherd-storage"
test = "replica::chain::tests::a_corrupted_segment_of_the_same_size_invalidates_custody"
proves = """
why there is no intermediate `Present` level. A HEAD proves SIZE, and
size cannot distinguish the right bytes from any others of that length —
offering it as a custody level is the substitution §4.10.2 refuses for the
closing HEAD. Kills the existence-only mutation that the deleted-segment row
above does not.

NOT YET LOAD-BEARING IN PRODUCTION: `verify_segments` has no production caller,
so `custody_eligible()` answers false for every real chain until the periodic
replica-verification pass is wired to call it. That costs nothing today —
`dispatch.rs` already hardcodes `custody_eligible: false` at registration — but
it is a refusal waiting to be noticed, not a working check.
"""

