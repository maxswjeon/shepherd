# ---------------------------------------------------------------------------
# Phase 1 guards — §9's Phase 1 row, clause by clause.
# ---------------------------------------------------------------------------
#
# Guards rather than ACs for the same reason as Phase 0's: §9's Phase 1 row
# demands eight things that carry no AC number, and the numbered set is fixed at
# AC-1..AC-65 by the Appendix. Each row below quotes the clause it answers, and
# `[[phase]]` at the foot of this file ties them to §9's text verbatim so the
# tie cannot rot silently.
#
# Several are PARTIAL: evidence that genuinely runs, plus a stated gap that
# keeps the row red. That is AC-2's pattern and it is the honest shape for this
# phase — the mechanisms are largely built and the SCALES and PLATFORMS §9 names
# are not reachable from this machine.

[[guard]]
id = "G-1-M1-FUNC"
owning_gate = "1"
exercises = ["shepherd-daemon", "shepherd-scan::walk", "shepherd-catalog::file_repo", "shepherd-index::meta", "shepherd-cli"]
note = "§9 M1 leg 1: `functional pipeline over the 1M on-disk corpus`"
evidence_missing = """
SCALE ONLY, AND THE GAP IS FIVE ORDERS OF MAGNITUDE. The pipeline is proven \
end to end — a real daemon over a real socket, a real walk, a real catalog, a \
real index, and the real `shepctl` binary — at NINE files. §9 demands the same \
line over a 1M-file on-disk corpus. Everything the cited tests assert about \
correctness is untouched by the difference; everything that only appears at \
scale (walk throughput, catalog write pressure across a long scan, index build \
memory, WAL growth across the full scan per E-4) is unproven, and the failures \
that live there are exactly the ones a nine-file run cannot see.

The corpus is being built on the NAS by another worker rather than duplicated \
here. When a recorded run over it exists, this row cites it and the gap closes; \
until then the mechanism is proven and the milestone is not.\
"""

[[guard.evidence]]
package = "shepherd-daemon"
test = "search_finds_scanned_files_and_misses_absent_ones"
proves = "PARTIAL — the M1 demo line's shape at nine entries: scan populates the catalog, search returns the files that match and NOT the ones that do not, and the daemon's own doctor reports the same entry count. The miss half is what stops a matcher that returns everything satisfying the hit half"

[[guard.evidence]]
package = "shepherd-daemon"
test = "shepctl_drives_a_real_daemon_end_to_end"
proves = "PARTIAL — the demo runs through the real `shepctl` binary over a real socket, not through an in-process shortcut, so the CLI path §9's demo line names is the path exercised"

[[guard.evidence]]
package = "shepherd-daemon"
test = "a_scan_walks_the_root_and_the_files_land_in_the_catalog"
proves = "PARTIAL — the walk's output is asserted against the catalog's row count rather than against the walker's own report"

[[guard.evidence]]
package = "shepherd-daemon"
test = "scanning_twice_converges_rather_than_duplicating"
proves = "PARTIAL — rescanning converges; the failure this guards (a second scan doubling the catalog) is one that only shows up once a scan is repeated, which a single-run demo would never do"

[[guard.evidence]]
package = "shepherd-daemon"
test = "shepctl_search_returns_json_a_script_can_read"
proves = "PARTIAL — the `--json` half of the demo line: the output is machine-readable, which is what makes the demo assertable rather than eyeballed"

[[guard]]
id = "G-1-M1-PERF"
owning_gate = "1"
exercises = ["shepherd-index::meta", "shepherd-bench"]
note = "§9 M1 leg 2: `< 50 ms p95 over a 10M-row injected catalog`"
evidence_missing = """
THE INDEX, NOT THE PIPELINE. The cited test builds a real 10M-entry index and \
asserts p95 < 50 ms — a genuine bar, failed rather than printed, in-process. \
What §9 asks for at this phase is that bar over a 10M-row catalog INJECTED BY \
shepherd-bench and queried through the daemon, which is a different \
measurement: four concurrent clients against a live daemon under background \
ingest, per bench-contract.toml. Phase 0b measured exactly that and recorded \
23.48 ms cold / 22.20 ms warm (G-0B-BARS asserts it), but that is a Phase 0b \
artifact re-read, not a Phase 1 run, and §9 rule 3 has the metadata bar \
re-measured FROM Phase 1.

So: the data structure meets the bar today, on this machine, at 10M. The \
sentence §9 wrote — the same bar through the daemon on an injected catalog — \
has no run behind it at Phase 1.\
"""

[[guard.evidence]]
package = "shepherd-index"
test = "meta::tests::the_production_index_meets_the_50ms_bar_at_10m_entries"
ignored = true
release = true
proves = "PARTIAL — 10M entries, 200 queries over ten as-you-type patterns, `assert!(p95 < 50.0)`. It also asserts hits for the queries that should hit and NO hits for the four that should not, which is the guard that stops a p95 measured over an index that matches nothing. Cited with `ignored` and `release` because it refuses to run in debug rather than report a meaningless number — running it explicitly is the opposite of §9 rule 1's skipped test"

[[guard]]
id = "G-1-IDENTITY-KEY"
owning_gate = "1"
exercises = ["shepherd-catalog::identity"]
note = "§9: `content-addressed keys collision-free under a case/normalization fuzz corpus`"
evidence_missing = """
EXAMPLES, NOT A CORPUS. Every normalisation and case rule §4.9 states is \
proven — but by ONE hand-chosen pair each: one NFC/NFD spelling of `café`, one \
`Dir/Report.TXT` against `dir/report.txt`. §9 says `fuzz corpus`, and there is \
no proptest, quickcheck, arbitrary or cargo-fuzz dependency anywhere in this \
workspace, so no input has ever been tried that a human did not choose. The \
class of defect a corpus finds is precisely the one examples cannot: a \
composition (a Turkish dotless i under case folding, a combining sequence with \
more than one mark, a normalisation that changes length) that nobody thought \
to write down.

Stated rather than papered over with a generated-input test written by the \
same hand that chose the examples: that would explore the same shapes with \
more values, which is not what a fuzz corpus is for.\
"""

[[guard.evidence]]
package = "shepherd-catalog"
test = "identity::tests::nfd_and_nfc_fold_to_one_norm_key"
proves = "PARTIAL — the two Unicode spellings of one path converge on one norm_key under both Nfc and Nfd policy, so a file does not acquire two catalog identities by how its name was typed"

[[guard.evidence]]
package = "shepherd-catalog"
test = "identity::tests::preserve_keeps_the_two_spellings_apart"
proves = "the negative that gives the fold meaning: under Preserve the same two spellings must NOT collapse. Without this, an implementation that folded everything unconditionally would satisfy the row above while destroying the distinction on filesystems that keep it"

[[guard.evidence]]
package = "shepherd-catalog"
test = "identity::tests::case_folding_follows_the_root_policy"
proves = "PARTIAL — case folding is driven by the per-root probed policy, asserted in both directions: distinct under Sensitive, equal under Insensitive"

[[guard.evidence]]
package = "shepherd-catalog"
test = "identity::tests::separators_are_unified"
proves = "a backslash and a forward slash yield one key, so the same file does not get two identities across platforms"

[[guard.evidence]]
package = "shepherd-catalog"
test = "identity::tests::path_never_enters_the_key"
proves = "the content-addressed half: the key is a function of the hash alone, so two identical files at different paths share one object and a rename cannot orphan one"

[[guard.evidence]]
package = "shepherd-catalog"
test = "identity::tests::key_layout_fans_out_on_the_hash"
proves = "the emitted key has the documented two-level fan-out, which is what stops one flat prefix holding every object on a target that lists lexicographically"

[[guard.evidence]]
package = "shepherd-catalog"
test = "identity::tests::probe_detects_this_filesystem_and_cleans_up_after_itself"
proves = "the policy is PROBED on a real filesystem rather than assumed, and the probe leaves nothing behind — an assumed policy is how a case-insensitive root gets case-sensitive keys"

[[guard.evidence]]
package = "shepherd-catalog"
test = "identity::tests::probe_on_a_missing_root_assumes_rather_than_failing"
proves = "and when it cannot probe it says so (`assumed == true`) instead of reporting a detected answer it did not detect"

[[guard]]
id = "G-1-IDENTITY-FSID"
owning_gate = "1"
exercises = ["shepherd-catalog::volume"]
note = "§9: `fs_id stable across a simulated remount`"
evidence_missing = """
NO REMOUNT IS SIMULATED, AND fs_id ITSELF IS UNTESTED. This is the weakest row \
in Phase 1 and it should be read as red rather than partial. `fs_id()` and \
`volume_id()` have no direct test; nothing in the workspace remounts anything, \
changes a mount point, or varies st_dev. The cited tests prove the mountinfo \
PARSER and the longest-prefix mount resolution — the inputs fs_id is computed \
from — which is genuinely load-bearing (a parser that mis-attributed a path to \
`/` would make fs_id wrong for every file under a nested mount) but is not the \
property §9 names.

Writing the missing test is small and belongs to whoever owns volume.rs: mount \
a fixture at two different mount points and assert one fs_id. It is not \
written here because a test authored alongside the gate that grades it, by \
someone who has not read why volume_id is derived the way it is, is how a \
tautology gets committed with a confident name.\
"""

[[guard.evidence]]
package = "shepherd-catalog"
test = "volume::tests::mountinfo_parses_past_the_variable_optional_fields"
proves = "PARTIAL — /proc/self/mountinfo's variable optional-field section is parsed correctly, including the CIFS line that has none. A parser that miscounted fields here would read the wrong column as the device and give every file the wrong volume"

[[guard.evidence]]
package = "shepherd-catalog"
test = "volume::tests::the_longest_matching_mount_point_governs"
proves = "PARTIAL — a path under a nested mount resolves to that mount and not to `/`, which is the resolution fs_id depends on"

[[guard.evidence]]
package = "shepherd-catalog"
test = "volume::tests::a_mount_point_prefix_must_end_at_a_separator"
proves = "`/tmpfoo/x` does not resolve to `/tmp` — the substring-is-not-a-component defect, in the mount table this time"

[[guard.evidence]]
package = "shepherd-catalog"
test = "volume::tests::octal_escapes_are_decoded"
proves = "a mount point containing a space round-trips, so a real user's external drive does not silently resolve to the wrong volume"

[[guard]]
id = "G-1-ATIME"
owning_gate = "1"
exercises = ["shepherd-catalog::atime", "shepherd-rules::match"]
note = "§9: `atime_mode detection correct on all three platforms`"
evidence_missing = """
ONE PLATFORM, AND NOT THE DETECTOR. §9 says all three. What is proven is the \
Linux mount-option CLASSIFIER — noatime beats relatime, lazytime does not \
change file atime fidelity, a substring is not an option — and the rule-level \
consequences that classification drives. What is NOT proven: `atime::detect()` \
itself, which reads /proc/self/mountinfo and has no test at all; and macOS and \
Windows, which today return Unknown and are covered by nothing. Unknown is the \
fail-closed answer, so an untested platform degrades safely rather than \
dangerously — destructive age rules are refused on Unknown, which IS asserted \
— but `correct on all three platforms` is not what that says.\
"""

[[guard.evidence]]
package = "shepherd-catalog"
test = "atime::tests::explicit_noatime_disables"
proves = "PARTIAL (Linux) — noatime classifies as Disabled, and wins when it appears alongside relatime"

[[guard.evidence]]
package = "shepherd-catalog"
test = "atime::tests::relatime_is_explicit_or_the_default"
proves = "PARTIAL (Linux) — relatime is detected when stated AND assumed when unstated, which is the case that matters because it is the kernel default and the one an implementation is most likely to miss"

[[guard.evidence]]
package = "shepherd-catalog"
test = "atime::tests::a_substring_is_not_an_option"
proves = "`some_noatime_lookalike` does not disable atime — the same substring-versus-token defect the deny-list carries, in the mount options"

[[guard.evidence]]
package = "shepherd-catalog"
test = "atime::tests::the_stricter_classification_wins_when_mount_and_superblock_disagree"
proves = "when two sources disagree the STRICTER answer wins, so a disagreement cannot resolve in favour of trusting atime"

[[guard.evidence]]
package = "shepherd-catalog"
test = "atime::tests::destructive_age_rules_are_rejected_on_disabled_and_unknown"
proves = "§4.12's actual safety property: Unknown is treated like Disabled, so an undetected platform refuses destructive age rules rather than silently trusting a timestamp nothing verified"

[[guard.evidence]]
package = "shepherd-rules"
test = "r#match::tests::a_destructive_atime_rule_is_rejected_on_a_disabled_root"
proves = "the rejection is enforced where it matters — Matcher::compile refuses, so the rule cannot exist rather than being filtered later"

[[guard.evidence]]
package = "shepherd-rules"
test = "r#match::tests::the_age_signal_follows_the_documented_fallback_order"
proves = "the fallback order is asserted rather than assumed: observed access, then atime only when Reliable, then mtime — so a preview can disclose which signal drove a match"

[[guard]]
id = "G-1-JOBS"
owning_gate = "1"
exercises = ["shepherd-jobs::queue", "shepherd-jobs::worker"]
note = "§9: `Job-queue core: kill-and-resume of a checkpointed job`"

[[guard.evidence]]
package = "shepherd-jobs"
test = "worker::tests::kill_and_resume_of_a_checkpointed_job"
proves = "the §9 clause exactly: a job checkpoints, the actor is dropped with the row left Running, and a second run recovers it, hands the executor back the SAME checkpoint payload, and completes — with attempts == 2, so the resume is visible as a resume rather than as a fresh job. Over a real file-backed database, not a memory store"

[[guard.evidence]]
package = "shepherd-jobs"
test = "queue::tests::recovery_requeues_a_non_destructive_job_with_its_checkpoint"
proves = "the checkpoint survives the crash boundary at the queue layer too, so the resume above is a property of the store rather than of the worker that happened to hold it"

[[guard.evidence]]
package = "shepherd-jobs"
test = "queue::tests::recovery_quarantines_an_interrupted_destroy_instead_of_requeueing_it"
proves = "the negative that makes resume safe: an interrupted DESTROY is quarantined, never replayed. Abort-forward-never. Without this row, `resume everything` would satisfy the positive one and re-run the only irreversible operation in the product"

[[guard.evidence]]
package = "shepherd-jobs"
test = "queue::tests::recovery_handles_a_mixed_batch_and_is_idempotent"
proves = "recovery run twice does not resurrect what it already handled — a crash during recovery is a real state and this is the one that says what happens in it"

[[guard.evidence]]
package = "shepherd-jobs"
test = "queue::tests::recovery_clears_any_backoff_the_crash_interrupted"
proves = "a job that was backing off when the process died is claimable after recovery rather than waiting out a timer that no longer has anything counting it"

[[guard]]
id = "G-1-WRITER"
owning_gate = "1"
exercises = ["shepherd-catalog::schema", "shepherd-catalog::file_repo"]
note = "§9: `Catalog write discipline: single-writer actor`"

[[guard.evidence]]
package = "shepherd-catalog"
test = "writer::tests::concurrent_writers_over_one_file_serialize"
proves = "eight threads and two hundred inserts through one actor over a file-backed WAL database land two hundred rows. The assertion is the COUNT: a lost row is the signature of two threads reaching the connection, which is the defect the single-writer rule exists to prevent, and it is invisible to an assertion that only checks the writes returned Ok"

[[guard.evidence]]
package = "shepherd-catalog"
test = "writer::tests::shutdown_drains_what_was_already_submitted"
proves = "the writes are durable rather than merely acknowledged: the database is REOPENED and re-counted, so an actor that dropped its queue on shutdown fails here"

[[guard.evidence]]
package = "shepherd-catalog"
test = "writer::tests::a_handle_that_outlives_its_actor_reports_gone"
proves = "a handle whose actor is gone reports it instead of blocking forever — the failure mode that turns a dead writer into a hung daemon"

[[guard]]
id = "G-1-CHECKPOINT"
owning_gate = "1"
exercises = ["shepherd-catalog::schema"]
note = "§9: `dedicated PASSIVE-checkpoint connection`; E-4 sharpens it to WAL bounded across the full 10M scan"
evidence_missing = """
NOTHING ASSERTS THIS. No evidence is cited because none exists, and citing the \
single-writer tests would be citing a test that constructs the checkpoint \
connection and then asserts row counts. `checkpoint_loop` — which opens its \
own connection and issues `PRAGMA wal_checkpoint(PASSIVE)` — has no test; no \
test in the workspace mentions wal_checkpoint or PASSIVE at all; and no test \
asserts the checkpoint connection is separate from the writer's, which is the \
whole content of the clause (a PASSIVE checkpoint on the writer's own \
connection is a different mechanism with different blocking behaviour).

E-4 in open-questions.md sharpens this and is worth quoting, because it names \
the failure directly: `Phase 1's gate must show WAL bounded across the full \
10M scan, not merely that a checkpoint connection exists. Flagged so the Phase \
1 gate is written to assert the bound rather than the mechanism — the \
difference between those two is this project's recurring defect in its purest \
form.` E-4 is an OPEN escalation. It is also not in §9's Phase 1 row, so \
without this note the sharper requirement would sit outside the gate entirely.\
"""

[[guard]]
id = "G-1-INSTALL-LINUX"
owning_gate = "1"
exercises = ["shepherd-daemon::service", "shepherd-obs"]
note = "§9: `Daemon installs on Linux (systemd user unit; lingering checked and warned, never forced — OQ-F)`"
evidence_missing = """
THE UNIT IS PROVEN; INSTALLING IT IS NOT. Everything about WHAT gets installed \
is asserted — the unit's contents, and the lingering policy in unusual depth. \
What no test touches is `systemd::install()` itself: writing the unit file to \
the user unit directory and invoking `systemctl --user daemon-reload` and \
`enable`. §9's verb is `installs`. The gap is narrow and real: a unit whose \
text is perfect and whose install path writes to the wrong directory satisfies \
every row cited below.\
"""

[[guard.evidence]]
package = "shepherd-daemon"
test = "service::systemd::tests::the_unit_starts_the_daemon_in_run_mode"
proves = "PARTIAL — the generated unit runs the daemon in `run` mode and is wired to default.target, so it starts at session start (AC-59's OQ-F amendment) rather than at boot"

[[guard.evidence]]
package = "shepherd-daemon"
test = "service::systemd::tests::the_unit_restarts_on_failure_only"
proves = "Restart=on-failure and NOT Restart=always — asserted in both directions, because `always` would fight a user who stopped the daemon deliberately"

[[guard.evidence]]
package = "shepherd-daemon"
test = "service::systemd::tests::the_unit_never_mentions_lingering"
proves = "the unit does not touch lingering at all, which is the never-forced half of OQ-F expressed where it could most easily be violated"

[[guard.evidence]]
package = "shepherd-obs"
test = "lingering::tests::the_remediation_names_the_command_but_nothing_runs_it"
proves = "the strongest row here: the test greps its OWN SOURCE via include_str! and fails if any line both constructs a Command and mentions enable-linger, then asserts the only subprocess invoked is the read-only `show-user` query. OQ-F says check and warn, never force; this asserts the absence of the forcing code rather than the presence of a warning"

[[guard.evidence]]
package = "shepherd-obs"
test = "lingering::tests::a_headless_disabled_node_warns_and_says_it_is_expected"
proves = "the warning states the consequence plainly — the daemon will NOT start when logged out, this is expected behaviour, and Shepherd will not change the setting — which is the product decision OQ-F records, asserted rather than assumed"

[[guard.evidence]]
package = "shepherd-obs"
test = "lingering::tests::unparseable_output_is_unknown_not_assumed_enabled"
proves = "garbage from loginctl reads as Unknown, never as enabled. Assuming enabled is the failure that would silently drop the warning on exactly the machines that need it"

[[guard.evidence]]
package = "shepherd-daemon"
test = "nothing_the_daemon_runs_enables_lingering"
proves = "end to end, over a real daemon: the lingering state before and after running the daemon plus doctor plus status is identical. The never-forced clause proven by observation rather than by code inspection"

[[guard.evidence]]
package = "shepherd-daemon"
test = "doctor_reports_the_lingering_check_and_never_changes_it"
proves = "the check is always present in doctor's output and never reports `fail` — a warning, surfaced, as OQ-F requires, rather than a blocker or a silence"

