`spikes/` does not exist in the tree, so there is nothing preserved and \
nothing deleted. Correctly a 0c concern: the spike sources are 0c's output, \
and this clause sits in the 0a/0b row. Reported rather than filed against 0c \
on my own authority — where a clause of §9 belongs is the plan's call, not the \
gate's.\
"""

