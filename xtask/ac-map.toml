[[guard]]
id = "G-1-M1-PERF"
owning_gate = "1"
exercises = ["shepherd-index::meta", "shepherd-bench"]
note = "§9 M1 leg 2: `< 50 ms p95 over a 10M-row injected catalog`"

[[guard.evidence]]
package = "shepherd-index"
test = "meta::tests::the_production_index_meets_the_50ms_bar_at_10m_entries"
ignored = true
release = true
proves = "PARTIAL — 10M entries, 200 queries over ten as-you-type patterns, `assert!(p95 < 50.0)`. It also asserts hits for the queries that should hit and NO hits for the four that should not, which is the guard that stops a p95 measured over an index that matches nothing. Cited with `ignored` and `release` because it refuses to run in debug rather than report a meaningless number — running it explicitly is the opposite of §9 rule 1's skipped test"

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::the_metadata_bar_holds_through_the_daemon_on_an_injected_catalog"
proves = """
§9's M1 leg 2 AS WRITTEN, and measured FROM Phase 1 rather than re-read from Phase 0b: the
metadata p95 over a 10M-row catalog INJECTED BY shepherd-bench in the real §4.4 schema and
queried THROUGH a live daemon — four separate socket connections, under background ingest,
pinned to the contract's cores — clears the precommitted 50 ms bar in BOTH cache states.
COLD 41.22 ms, WARM 33.90 ms. This could not have been satisfied by re-reading meta_bench_arena_*
however good its numbers are: that is an in-process measurement and this clause is about the path
through the daemon, which is a different quantity and is measured below to cost 15.81 ms of
concurrency alone.
Asserts not only the p95 but what it is a measurement OF — zero_hit == 0, contract row count
and client count, the pinned core list, and NON-ZERO BACKGROUND INGEST IN EVERY RUN (that last
one because this harness shipped a cursor bug that left runs 1 and 2 of every cell inserting
nothing while still carrying the label 'under background ingest').

THREE CAVEATS, CARRIED NOT BURIED.
(1) Run-to-run drift is FLAGGED in both cells — 17.08% cold, 12.92% warm, against the
contract's 10% — and cold run 1 at 46.56 ms passed by 3.4 ms. This is a pass with flagged
drift and thin headroom, which is a weaker claim than a clean pass, and the test asserts
drift_flagged is RECORDED (never that it is false) so a re-measure cannot drop the field and
silently upgrade it.
(2) The contention guard that admitted these runs CANNOT DISCRIMINATE at the level that
matters. Its threshold went 0.90 -> 0.84 during this work: 0.90 sat above this host's measured
idle floor (88.4% mean, 86.3-90.6% over six samples on an empty box) and was unsatisfiable
rather than strict, but at 0.84 a neighbouring 10M scan measuring ~85% now passes. No absolute
idle threshold separates those distributions on this host; the fix is a different guard design
and is a follow-up. So the guard is NOT the evidence these runs were uncontended. The evidence
is the recorded per-run samples — cold idle before [.889 .944 .938] / after [.914 .945 .879],
warm before [.903 .934 .958] / after [.961 .933 .950] — every one at or above the empty-box
baseline, checkable from the artifact by someone who trusts neither the guard nor its author.
Ten of those twelve samples would also have cleared the original 0.90, and all twelve clear
0.87, so the recalibration did not manufacture this result.
(3) REPRODUCIBILITY: this box could not hold that state on demand. Both cells needed several
attempts to find a window, on a host whose steady state is ~15 claude processes, tmux, byobu
status shells and five vscode-server nodes. The number is sound; obtaining it required the box
to be quieter than its own baseline, and a re-run should budget for that.

CONCURRENCY IS WHERE THE COST IS, AND THE HEADROOM IS THEREFORE FRAGILE. A supplementary
1-client diagnostic (meta_daemon_bench_warm__diagnostic_1c, marked supplementary_diagnostic and
emitted under its own key so it can never be read as a contract cell) measured 18.09 ms p95 and
1.29 ms p50 against the contract cell's 33.90 ms p95 and ~8 ms p50. Same harness, same corpus,
same committed trace, same binary, same session — ONLY the client count differs, so the 15.81 ms
between them is attributable to concurrency and to nothing else. That is 47% of the entire warm
figure, and the 6x median inflation is the sharper tell: a fixed per-call cost cannot move a p50
like that; serialisation can. CONSEQUENCE FOR AC-40: the 32% headroom measured at four clients
rests mostly on a term that grows with client count, and must NOT be read as 32% headroom in
general. Stated as direction, not as a scaling law — two points do not give an exponent and none
was measured.

NOT A DECOMPOSITION AGAINST THE IN-PROCESS ANCHOR. The same-session in-process anchor measured
14.91 ms, but it builds its own uniform synthetic corpus and queries 10 hand-written patterns x
20 rounds, four of which are deliberate misses that scan the whole arena with no early exit —
where the trace queries here early-exit at cap=50. Subtracting it from either daemon figure
crosses both corpus and query set, so 18.99 ms as a 'daemon path cost' and any per-call versus
concurrency percentage split derived from it are INDICATIVE ONLY. The load-bearing comparison is
18.09 -> 33.90, which is like-for-like. This distinction is recorded because the cross-workload
subtraction was written into an earlier draft of this row as though it were measured.

MECHANISM STILL NOT ATTRIBUTED — TWO OF THREE CANDIDATES REMAIN LIVE. The diagnostic separates
per-call cost from concurrency cost and shows concurrency dominates. It does NOT separate the two
concurrent candidates from each other: writer-actor hydration queueing (dispatch.rs:344 -> cat()
-> writer().try_with — one thread, one connection, four clients serialising) and backfill from
SQLite's page-count autocheckpoint (armed because the catalog's PRAGMAS never disable it; tripped
by the ingest thread's ~100-rows-per-50ms commits). Both scale with client count identically.
Distinguishing them needs a WAL-size or checkpoint-count probe correlated against per-query
latency, which was not built. Per-call cost is the one candidate this measurement retires as the
dominant term.
"""

