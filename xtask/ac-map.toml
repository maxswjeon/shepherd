[[ac]]
id = "AC-2"
owning_gate = "2"
exercises = ["shepherd-storage::multipart", "shepherd-storage::transfer_session", "shepherd-jobs::queue"]
note = "the required 50 GB artifact is produced in the owning gate, not deferred to nightly"
evidence_missing = "SIZE ONLY. The mechanism is proven; the artifact is not. The cited tests use a 51-byte body with 16-byte parts, while Sec9's Phase 2 line requires a fresh 50 GB resume artifact IN THIS GATE, not merely nightly. Citing them as full evidence would turn this gate green without the thing it exists to check having happened. HARDWARE PREREQUISITE: not producible here at ~19 GiB free; the plan now carries a ~60 GiB requirement. The Sec8.2-vs-Sec9 contradiction is resolved in the plan, Sec9 winning as the later reviewed text, so the 5 GB per-push substitution does NOT satisfy this gate."

[[ac.evidence]]
