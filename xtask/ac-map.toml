[[ac.evidence]]
package = "shepherd-tier"
test = "discard::tests::an_executed_episode_charges_the_window_exactly_once_per_object"
proves = """
THE ROLLING BREAKER WAS NEVER CHARGED. `RateWindow::record` had ZERO
production callers anywhere in the workspace, so repeated sub-threshold episodes
kept seeing the same unused budget and the blast-radius control was a check with
no subject.

HOW IT SURVIVED THE EARLIER GATE, recorded because it is this project's purest
specimen: the AC evidence test `breaker::tests::repeated_sub_threshold_passes_cannot_evade_the_window`
HAND-FEEDS ITS OWN SUBJECT —

    w.record(t(1), 4);
    w.record(t(2), 4);

— proving the window ARITHMETIC while production never called `record` at all.
An AC proven by a test that supplies the very input whose absence was the bug.

This row asserts the window ends at EXACTLY 3: not 0 (the pre-fix answer) and
not 6 (a double charge).
"""

[[ac.evidence]]
package = "shepherd-tier"
test = "discard::tests::an_exhausted_charge_refuses_before_anything_is_deleted"
proves = "the TOCTOU direction the finding named: the charge is reserved and persisted BEFORE the deletion it pays for, so a record-after-delete fix — which would ship the second bug the finding describes — fails here. Asserts on the FACT (`deleted() == 1`), not on the error, and dies when `spend()` is moved after the delete"

[[ac.evidence]]
package = "shepherd-tier"
test = "discard::tests::two_episodes_evaluating_against_one_snapshot_cannot_both_reserve"
proves = "what separates two racers: `evaluate_discard` reads a snapshot and is advisory, `try_charge` is test-and-consume in one step and is the authority. This is the only test that isolates atomicity — the accumulate test is also caught by the advisory check, so it cannot"

[[ac.evidence]]
package = "shepherd-tier"
test = "discard::tests::a_candidate_from_another_episode_cannot_be_deleted_with_this_episodes_charge"
proves = """
a charge was a COUNT, not a permission for a named object: the episode
confirmed one candidate, the caller named a different one, and the count-only
`spend()` authorised its irreversible deletion (`got Ok(())`, `deleted() == 1`).
`DiscardCharge` now carries the confirmed set itself and `spend` RETURNS the key
it authorised — `execute_discard` takes no `ObjectKey` at all, so a wrong key
stopped being something we refuse and became something no caller can express.
Also asserts `remaining() == 1`, because a refusal that consumed the unit would
leave the confirmed object undeletable.
"""

[[ac.evidence]]
package = "shepherd-tier"
test = "discard::tests::varying_any_single_field_of_a_candidate_refuses_it"
proves = "membership must be WHOLE-candidate equality. Mutating it to compare `file` alone reports `a candidate differing only in `path` was accepted: Ok(())` — a row whose path drifted from the one the operator read, deleted on the strength of a matching file id"

[[ac.evidence]]
package = "shepherd-tier"
test = "discard::tests::the_key_is_derived_from_the_candidate_and_the_targets_prefix"
proves = """
the test a suffix check fails: it deletes under a DIFFERENT prefix and
asserts this target's object — identical hash — survives. An
`ends_with(<hash hex>)` check would pass every other row here while leaving the
prefix non-load-bearing, so a foreign-prefix key with the right hash sails
through. Refused in the design and the reason written at the `DiscardCharge`
doc.

STATED RESIDUAL: `prefix` is the one component `spend` cannot cross-check,
because the charge does not know its target's prefix — that is config, not
`Episode` data. Closing it means persisting the key on the candidate and folding
