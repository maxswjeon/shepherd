[[guard]]
id = "G-1-CHECKPOINT"
owning_gate = "1"
exercises = ["shepherd-catalog::schema"]
note = """
§9 Phase 1, AS CORRECTED 2026-08-19: `single-writer actor, and a WAL bounded
across the full scan`. The clause previously read `dedicated PASSIVE-checkpoint
connection` and named the wrong component as the thing holding the bound. Both
the plan clause and docs/adr/0b-capacity-model-50tb.md are amended; NO CODE
CHANGED, because the code was never what was wrong.

WHAT BOUNDS THE WAL IS SQLite's PAGE-COUNT `wal_autocheckpoint`, which fires at
a commit boundary on the WRITING connection where backfill is possible. The
dedicated 30 s PASSIVE connection exists, demonstrably checkpoints (second
evidence row below, mutation-proven), and is a supplementary backstop.

Measured, one corpus, one machine, one pragma different:

    wal_autocheckpoint ON  (production)        WAL peak     7.9 MiB
    wal_autocheckpoint OFF (30 s thread alone) WAL peak 6,378.8 MiB

808x, and the second figure breaches ADR 0b's own 1 GB reject threshold by
6.4x. A PASSIVE checkpoint cannot backfill frames a reader still holds; the
index rebuild reads continuously during a scan, so the WAL tracks CORPUS SIZE
rather than the interval — it grew across three intervals rather than plateauing
at one. A SHORTER INTERVAL DOES NOT HELP, and that is the non-obvious part.

THE OPERATIONAL TRAP, which is why this is in a rendered note rather than a
commit message: `catalog::PRAGMAS` does not set `wal_autocheckpoint`, so the
bound rests on SQLite's default being left alone. Setting it to 0, or opening a
catalog connection without `PRAGMAS`, silently removes the bound — and until
this correction both §9 and ADR 0b told the reader the dedicated thread had them
covered.
"""


[[guard.evidence]]
package = "shepherd-daemon"
test = "the_m1_demo_holds_at_a_million_files"
ignored = true
requires_env = "SHEPHERD_M1_CORPUS"
release = true
proves = "the WAL BOUND across the FULL 10,000,000-file scan E-4 named, at the scale E-4 named. SAMPLED throughout — 2,066 readings at 1 s — and asserted on the MAXIMUM of the series rather than a final reading, which is the distinction that makes it evidence: a WAL that grew without bound and was checkpointed once at the end satisfies a closing measurement and fails this. Peak 11.30 MiB against the 64 MiB ceiling, first reached at t=633 s and then FLAT AT THAT MAXIMUM for the remaining 69 percent of the scan while ~6.9M further rows landed and the catalog grew to 4,513 MiB — the log held 0.25 percent of what it wrote. wal_max == wal_final is that plateau and NOT a still-growing log: a PASSIVE checkpoint backfills and SQLite reuses the log in place, so the file records a high-water mark and never shrinks. Daemon VmHWM 2,498 MiB, the Vec<FileStat> ceiling scan_exec.rs names 10M as the pressure point for, holding with room. What this does NOT establish is WHICH mechanism bounds it — see the note on this row. The scan_seconds / rescan_seconds / scan_files_per_sec figures in the artifact were taken on a contended box and the test already refuses to let them mean anything"

[[guard.evidence]]
package = "shepherd-catalog"
test = "writer::tests::the_checkpoint_lands_on_a_connection_the_writer_thread_does_not_own"
proves = "the STRUCTURAL half of §9's clause: that the connection issuing the checkpoint is a DISTINCT connection from the writer's. It is not a grep for wal_checkpoint and not a count of checkpoint calls — the call can be present, be issued, and the WAL still grow without bound. It measures an outcome only a separate connection can produce. The writer thread is put to sleep INSIDE a closure and a probe task submitted afterwards is asserted NOT to have completed, so the writer's connection is provably idle for the window; wal_autocheckpoint is disabled on the writer's connection and READ BACK as 0, so SQLite's own checkpointer cannot account for the result; and in WAL mode the main database file grows only when frames are backfilled. Growth in that window is therefore a checkpoint on a connection the writer thread was not touching. A second leg runs the identical window with checkpoint_path None and requires growth == 0, so the measurement has a control rather than a bare number. BOTH LEGS ARE MUTATION-PROVEN. Moving the checkpoint onto the WRITER'S OWN connection through the actor — same PRAGMA wal_checkpoint, same PASSIVE, same timer, indistinguishable to a grep — fails it. Giving the control leg a checkpoint thread also fails it. What this does NOT prove is the MODE: nothing asserts PASSIVE rather than TRUNCATE or RESTART"

