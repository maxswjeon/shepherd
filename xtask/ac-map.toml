[[guard]]
id = "G-1-ATIME"
owning_gate = "1"
exercises = ["shepherd-catalog::atime", "shepherd-rules::match"]
note = """
§9: `atime_mode detection correct on all three platforms`. CLOSED, and the
Linux half was the last to fall because it was the one nobody had questioned.

macOS and Windows detectors landed with direct tests. Writing Linux's exposed a
correctness gap the option strings hide: the kernel names `noatime` and
`relatime` in mountinfo and names `strictatime` NOWHERE — strict is the ABSENCE
of a flag, measured on tmpfs AND ext4. So `classify_mount_options` cannot tell a
strict mount from an undescribed one, answers `Relatime` for both, and
`AtimeMode::Reliable` was UNREACHABLE on Linux, leaving §4.12's fallback chain
with a rung this platform could never reach.

`detect()` still behaves exactly that way and still never answers `Reliable`.
The ambiguity is resolved where it can be resolved honestly — in
`detect_with_write_probe()`, on the `target.add` path — by MEASURING, which is
how macOS resolved its identical `statfs` ambiguity. It corners
`relatime_need_update()` by driving all three of its update conditions false
and VERIFYING from the inode that it did, so an advance on the second read can
only be strictatime.

It can only ever REACH `Reliable`, never default to it: every failure path
returns the mount-option answer. On this host `/dev/shm` — a real mount whose
options are silent — reads `Reliable` where the option string reads `Relatime`.

WHAT THIS ROW SHOULD NOT BE READ AS CLAIMING: `detect()` unqualified is still
option-based on Linux and still cannot see a strict mount. Only the probing
entry point can, and only at registration.

WHAT THIS GATE CANNOT RUN, stated because three macOS citations were removed
from this row rather than left to report `filter matched NOTHING` forever:
`atime::macos_tests::*` is `#[cfg(target_os = "macos")]`, so it does not exist
in the binary a Linux gate builds. Those tests are real and they pass — on the
macOS CI leg, which as of 2026-08-19 exists and is green. Citing them here made
the row red for a bookkeeping reason while the evidence itself was fine, which
is its own kind of false signal. The Windows classifier tests ARE cited below:
they are pure mapping tests in the shared module and run on every leg.
"""

