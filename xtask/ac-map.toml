test = "codegen::tests::every_method_gets_a_request_and_a_result_schema"
proves = "coverage is derived from the method table rather than a hand-kept list, so a new method cannot ship without schemas"

[[ac.evidence]]
package = "shepherd-proto"
test = "method::tests::schemas_are_deterministic"
proves = "determinism at the source, upstream of codegen — so a drift reported by --check is attributable to the table rather than to schemars ordering"

[[ac.evidence]]
package = "shepherd-daemon"
test = "shepctl_events_subscribe_renders_the_events_it_subscribed_to"
proves = """
`shepctl events subscribe` RENDERED NOTHING AND REPORTED SUCCESS. It
used the one-response `client::call` path, which reads the `SubscribeResult` and
drops the connection, so the daemon's pump saw a closed socket. The mutation
output is the finding in one frame: the daemon says `"replayed":2` while the
CLI printed zero events, `ok: true`, exit 0.

BEHAVIOUR CHANGE: the command is now long-running, terminating on daemon EOF
(exit 0) or Ctrl-C, with no new flags — this CLI's argument tree is derived from
each method's request schema by construction (AC-54), so a `--count`/`--for`
would be the first client-only argument. The read deadline is cleared ONLY for
the streaming phase; it still guards connect, handshake and the subscribe
response.

Asserts events BY CONTENT — monotonic seq, stream, a payload field — and
cross-checks `events_rendered` against the lines that reached stdout, so the
count cannot be right while the output is empty.
"""

[[ac.evidence]]
package = "shepherd-daemon"
test = "events::tests::a_subscriber_whose_queue_overflows_is_disconnected"
proves = """
a subscriber whose 256-frame queue filled was left REGISTERED with a
silently dropped frame, holding stale state indefinitely. The code's stated
recovery — the client notices a sequence gap — CANNOT WORK for a filtered
subscription, because sequence numbers are global and gaps from unrequested
streams are normal and documented as such.

DISCONNECT, NOT A MARKER, and the reason is the finding one level up: the queue
is full precisely because the client is not draining the socket, so a marker
frame would sit unread BEHIND THE VERY FRAMES IT REPORTS. A notification
deliverable only through the channel whose congestion it reports is not a
notification. EOF needs no reader to be true. No wire change; PROTO_VERSION
stays 1.3.
"""

[[ac.evidence]]
package = "shepherd-daemon"
test = "server::tests::an_overflowing_subscriber_sees_its_connection_close"
proves = "proven at the CLIENT end over a real `UnixStream::pair()`, exactly as `shepctl` reads it — SUBSCRIBER_QUEUE valid event frames, then `read_line` returns 0. Not `the daemon set a flag`. Queued frames are delivered before the close deliberately: they are frames the client is entitled to and they shorten the resume"

[[ac.evidence]]
package = "shepherd-daemon"
test = "server::tests::an_ordinary_end_of_stream_leaves_the_connection_open"
proves = "the acceptance direction against `disconnect everyone` — a clean end-of-stream leaves the socket writable, asserted by writing from the daemon side AFTER the pump returns and reading it on the client side. An overflow and a clean shutdown both reach the pump as a closed channel; only one may tear down the connection"

[[ac.evidence]]
package = "shepherd-daemon"
test = "events::tests::a_slow_subscriber_does_not_stall_the_publisher_or_its_peers"
proves = """
ORACLE DELIBERATELY CHANGED, recorded here so it is never mistaken for
an assertion weakened to make a build green. This test previously ended on
`assert_eq!(hub.subscriber_count(), 2)` under the comment `the slow subscriber is
still registered — it lost frames, it was not disconnected` — it ASSERTED THE
DEFECT AS THE DESIRED OUTCOME. Renamed to what it was actually guarding: the
publisher completes without blocking and the healthy subscriber loses nothing.
"""

