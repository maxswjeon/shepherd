covered_by = ["G-0B-CONTRACT"]

[[phase.requirement]]
quote = "carries explicit reject thresholds too"
covered_by = ["G-0B-CAPACITY"]

[[phase.requirement]]
quote = "Workspace CI green on all three platforms."
covered_by = ["G-0A-CI"]

[[phase.requirement]]
quote = "LIST-consistency confirmed against the local emulators only"
unencoded = """
NOTHING CARRIES THIS, AND IT CANNOT BE CARRIED FROM PHASE 0. No test asserts \
LIST pagination or visibility against MinIO, Azurite, Samba or NFS. \
tests/docker-compose.yml is committed; nothing reads it. The reason it is \
stated rather than encoded is structural and worth a plan correction: the \
machinery this clause exercises (shepherd-storage::s3, ::azure, ::nas) is \
created in Phases 2 and 6, so ANY row owning it at Phase 0 would be rejected \
by `gate --audit` as owned-too-early — the same unsatisfiable-gate class §9's \
own row text says it removed real-provider LIST evidence to avoid. The \
emulator leg has the identical shape one phase down.\
"""

[[phase.requirement]]
