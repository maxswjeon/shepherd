[[ac]]
id = "AC-1"
owning_gate = "2"
exercises = ["shepherd-tier::destroy", "shepherd-tier::verify", "shepherd-storage::s3"]

[[ac.evidence]]
package = "shepherd-tier"
test = "destroy::tests::the_happy_path_destroys_and_audits"
proves = "destruction happens only after a verified remote copy, and is audited"

[[ac.evidence]]
package = "shepherd-tier"
test = "m2_round_trip_mechanism_a_versioned"
ignored = true
requires_env = "SHEPHERD_MINIO_ENDPOINT"
proves = "AC-1's full remote re-read against real MinIO before any destruction"

[[ac.evidence]]
package = "shepherd-storage"
test = "s3::probe_tests::two_probes_of_one_algorithm_do_not_share_an_object_key"
proves = """
two concurrent `target.add` probes used the SAME fixed per-algorithm
object key, so one probe's cleanup DELETE could land between another's
`complete_multipart` and its HEAD — and a missing checksum reads as
`the provider does not support this algorithm`, a PERMANENT negative minted by a
transient race. Round 2 fixed the neighbouring version of this (an auth failure
recorded as non-support); same principle.

Per-invocation nonce `{pid}-{nanos}-{seq}`, matching the discipline
`identity.rs` and `atime.rs` now use for their own probes. The `{seq}` counter
is there because exclusive-create was declined — see below — so the name must
carry the whole guarantee, and a probability is not a guarantee.
"""

[[ac.evidence]]
package = "shepherd-storage"
test = "concurrent_registration_probes_do_not_race_into_a_false_negative"
ignored = true
requires_env = "SHEPHERD_MINIO_ENDPOINT"
proves = """
the race exercised against a REAL provider, and checked against an
UNCONTENDED BASELINE rather than against the other probes — two probes that both
raced into `adopted: none` would agree with each other perfectly, which is the
trap. Pre-fix, contended runs recorded MinIO — which does support CRC64NVME — as
`rejected at head`, degrading to CRC32C.

HONESTLY CHARACTERISED: under the pinned-nonce mutation this dies 4 runs in 5.
It is a probabilistic detector of a timing window, not a deterministic guard —
the deterministic guarantee is the unit test above, and this test's job is
proving the window is real rather than theoretical.

DECLINED: `IfAbsent`/exclusive-create, which needs `conditional_create` — this
probe's whole job is measuring ARBITRARY S3-compatibles, and a registration
failing over an unrelated precondition feature reports the wrong fact about the
provider. The catalog probes' motivation does not transfer either: those write
into a USER's directory where a collision hits real data, while
`_shepherd/probe/` is Shepherd's own namespace.

NEW TRADEOFF, RECORDED: cross-probe cleanup was what tidied an object left by a
probe killed between completion and DELETE. That tidying WAS the cross-probe
deletion being removed, so an orphan now survives until something sweeps the
prefix — one ~10 MiB object per crashed probe, a storage cost not a correctness
one.
"""

[[ac]]
id = "AC-2"
owning_gate = "2"
exercises = ["shepherd-storage::multipart", "shepherd-storage::transfer_session", "shepherd-jobs::queue"]
note = "the required 50 GB artifact is produced in the owning gate, not deferred to nightly — and as of the first evidence row below, it is. The removed `evidence_missing` said SIZE ONLY and named a HARDWARE PREREQUISITE (not producible at ~19 GiB free against a ~60 GiB requirement); that was resolved by moving the object and MinIO's erasure parity onto external storage (tests/docker-compose.nas.yml), which is worth recording because the gap was closed by changing where the bytes live rather than by changing what is asserted. Every load-bearing statement is in a `proves` line below rather than here, because `gate --phase` renders those and does not render this."

[[ac.evidence]]
package = "shepherd-tier"
test = "a_fifty_gb_upload_killed_mid_flight_resumes_without_resending_verified_parts"
ignored = true
requires_env = "SHEPHERD_MINIO_ENDPOINT"
proves = "§9's artifact, at full size: a real 50 GB object uploaded to MinIO in 746 parts, SIGKILLed once AT LEAST 186 parts are durably acknowledged, then resumed by a THIRD process opening its own database and its own client. The wait status is asserted to be SIGNAL 9 WITH NO EXIT CODE, so the boundary is a real process death rather than a dropped in-process handle — `resume` cannot quietly become `restart after a graceful shutdown`. The quantities are asserted as EQUALITIES, not as `> 0`: bytes_skipped equals a computed value — 186 x 64 MiB = 12,482,248,704 B, parts_sent + acked_before equals the persisted plan.part_count, and plan.part_size is checked against the persisted session so a size that never reached PartPlan::new would surface as 16 MiB and 2 981 parts instead of passing. Its in-run controls make both comparisons load-bearing at scale — an empty listing skips 0 B, and corrupting ONE part's ETag, or separately its length, moves the skip total down by exactly 67 108 864 B, one 64 MiB part, and no further. Prior state cannot reach it by construction: the session dir is PID-scoped and wiped BEFORE creation, so each run mints a fresh upload_id and `list_parts` cannot see an earlier run's parts even though the content-addressed key is identical every time. SCOPE: the kill lands at one point, a quarter of the object. A resume path correct at 25% and wrong at the first or last part would pass exactly as this does — a statement of what a single kill point can support, not a suspicion of a defect."

[[ac.evidence]]
package = "shepherd-storage"
test = "multipart::tests::a_changed_etag_or_size_forces_a_resend"
proves = "WHAT `VERIFIED` MEANS in AC-2's `without re-sending verified parts`, which a reader will otherwise take to mean Shepherd re-checked the bytes. A part is skipped only on three-way agreement — part number, ETag AND length — and this asserts both non-trivial conjuncts in the resend direction: a different token forces Send, and the SAME token with a length one byte short also forces Send. The ETag is the token the provider returned at upload, checkpointed durably and compared against what `list_parts` reports now; it is never recomputed from the local file, so the guarantee is that the provider is still consistent with its own receipt. Note that PartCheckpoint DOES carry a `local_blake3` and the predicate deliberately does not consult it — using it would mean re-reading 64 MiB per part, which is the cost resume exists to avoid. Content is re-read and hashed by AC-1's `m2_round_trip_mechanism_a_versioned`; this row is about the resume decision, not about content verification. Residual, a boundary rather than a defect: the property rests on the provider deriving its part ETag from the stored bytes and on MD5's collision resistance — irrelevant to a resume threat model, where nobody is crafting a colliding part to make Shepherd skip an upload."

[[ac.evidence]]
package = "shepherd-storage"
test = "multipart::tests::an_empty_provider_listing_resends_everything"
proves = "the fail-closed direction: when the provider reports no parts, every part is Send and bytes_skipped is 0 — the unit-scale twin of the 50 GB empty-listing control, and the case that matters because a session can expire while the local checkpoints survive. The other fail-closed half is in the source rather than a test: an ABSENT checkpoint ETag hits `continue` — no skip — with the reason stated as `the durable record does not prove the provider holds our bytes`."

[[ac.evidence]]
package = "shepherd-tier"
test = "session_store::tests::a_killed_upload_resumes_from_disk_without_resending_verified_parts"
proves = "the same mechanism at unit scale, kept deliberately: the acknowledged-part count survives a process boundary and reconcile_parts skips exactly that many, with bytes_skipped > 0. It runs in seconds with no MinIO and no scratch disk, so when the 50 GB legs cannot run this still asserts a property rather than nothing. An AC whose only evidence needs a 46-minute run and 110 GB of scratch is an AC that silently stops being checked."

[[ac.evidence]]
package = "shepherd-tier"
test = "session_store::tests::a_session_round_trips_through_a_real_file"
proves = "the session survives a process boundary at all: a durable store rather than MemStore, which is what was absent before 185598b."

