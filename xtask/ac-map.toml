# ---------------------------------------------------------------------------
# Phase 1 guards — §9's Phase 1 row, clause by clause.
# ---------------------------------------------------------------------------
#
# Guards rather than ACs for the same reason as Phase 0's: §9's Phase 1 row
# demands eight things that carry no AC number, and the numbered set is fixed at
# AC-1..AC-65 by the Appendix. Each row below quotes the clause it answers, and
# `[[phase]]` at the foot of this file ties them to §9's text verbatim so the
# tie cannot rot silently.
#
# Several are PARTIAL: evidence that genuinely runs, plus a stated gap that
# keeps the row red. That is AC-2's pattern and it is the honest shape for this
# phase — the mechanisms are largely built and the SCALES and PLATFORMS §9 names
# are not reachable from this machine.

[[guard]]
id = "G-1-M1-FUNC"
owning_gate = "1"
exercises = ["shepherd-daemon", "shepherd-scan::walk", "shepherd-catalog::file_repo", "shepherd-index::meta", "shepherd-cli"]
note = "§9 M1 leg 1: `functional pipeline over the 1M on-disk corpus`. Nothing load-bearing here — `note` is not rendered by `gate --phase`; the removal of this guard's former stated gap is recorded in the 1M row's `proves` line instead."

[[guard.evidence]]
package = "shepherd-daemon"
test = "the_m1_demo_holds_at_a_million_files"
ignored = true
requires_env = "SHEPHERD_M1_CORPUS"
release = true
proves = "§9's M1 functional leg at the size §9 names: `root add && scan start && search` over 1,000,000 real files on a real filesystem. files_seen and files_catalogued are BOTH exactly 1,000,000, and unchanged by a rescan — so the scan neither drops nor duplicates at scale, which a nine-file run cannot distinguish. The search needles are asserted against a committed manifest with expected counts including needles that must return ZERO, so a matcher that returned everything fails rather than passes. A smaller run is possible only by setting SHEPHERD_M1_SMALL_RUN_REASON, which forces the reason to be recorded rather than inferred — the same discipline as shepherd-bench's scaled_run_reason. Cited with requires_env because absent the corpus this cannot be produced, and absent evidence fails rather than skips. GAP REMOVED, NOT REWORDED: this guard previously carried `SCALE ONLY, AND THE GAP IS FIVE ORDERS OF MAGNITUDE` with a largest run of NINE files. §9 asked for the 1M corpus and the 1M corpus ran, so no delta remains to state — and a gap kept past its evidence is a gate failing for a reason that no longer exists, which is as wrong as passing for one that never did. COST: this row plus G-1-M1-PERF make `gate --phase 1` a SCHEDULED command — a 1M-file scan and a 10M index build in --release. Budget a window; do not run it into someone else's"

[[guard.evidence]]
package = "shepherd-daemon"
test = "search_finds_scanned_files_and_misses_absent_ones"
proves = "PARTIAL — the M1 demo line's shape at nine entries: scan populates the catalog, search returns the files that match and NOT the ones that do not, and the daemon's own doctor reports the same entry count. The miss half is what stops a matcher that returns everything satisfying the hit half"

[[guard.evidence]]
package = "shepherd-daemon"
test = "shepctl_drives_a_real_daemon_end_to_end"
proves = "PARTIAL — the demo runs through the real `shepctl` binary over a real socket, not through an in-process shortcut, so the CLI path §9's demo line names is the path exercised"

[[guard.evidence]]
