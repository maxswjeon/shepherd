content-addressed remote key — so an upload would send changed bytes under the
old key and discover the mismatch only after the full transfer. The assertion
prints the wrong key, computed by production code (`identity::content_key`)
rather than asserted about. Digest now survives only when size, mtime AND ctime
all match; ctime catches a write that restored mtime (`cp -p`, `rsync --times`,
`touch -r`), whose false positive is a wasted rehash rather than a wrong answer.

