[[guard]]
id = "G-0A-CI"
owning_gate = "0a"
exercises = ["ci"]
note = "§9: `Workspace CI green on all three platforms`"
evidence_missing = """
BOTH LEGS HAVE NOW EXECUTED FOR THE FIRST TIME. BOTH ARE RED, AND NEITHER RED \
IS A PRODUCTION DEFECT. This row previously read `declared, not green`, and \
recorded that no Windows or macOS leg had ever run. They have now — natively, \
not in CI, by the user's explicit decision on 2026-08-18 not to push the \
branch. That decision is why this row stays red: §9 asks for the result of a \
CI RUN, and no amount of local evidence is that. What follows is what the \
local runs found, which is worth more than the row's previous silence.

macOS (26.5.2, Mac16,10, arm64, rustc 1.96.0 — Rust was not installed on that \
machine at all before this). `cargo build --workspace --all-targets` GREEN. \
`cargo test --workspace` FAILS: 9 tests, ONE root cause — \
`shepherd-scan/src/floors.rs:317` gates `open_handles()` on \
`#[cfg(target_os = "linux")]`, so every other platform returns \
`Held(CouldNotDetermine)`. THAT FAIL-CLOSED BEHAVIOUR IS CORRECT. What is \
wrong is that the `destroy` tests assume the floor passes, so they are \
implicitly Linux-only and are not cfg-gated.

Windows (Server 2022, process-isolated container, rustc 1.96.0 — NOT a \
`windows-latest` VM, and this row must not imply it was). `cargo build \
--workspace --all-targets` FAILS: `lib.rs:28` correctly gates `pub mod server` \
on `#[cfg(unix)]` and `main.rs:33` imports it unconditionally; `main.rs:255` \
uses `std::os::unix::net::UnixStream` unconditionally; \
`shepherd-bench/src/gen_files.rs:766` calls a bare `symlink`; `shepherd-tier` \
uses `std::os::unix`, `MetadataExt` and `PermissionsExt` across three test \
files. With those three crates excluded, `cargo test --workspace \
--no-fail-fast` gives 502 PASSED / 9 FAILED / 9 ignored. Eight failures are \
`shepherd-placeholder::delete_mode`, where production fails closed and says so \
and the TESTS `unwrap()` it. The ninth is `shepherd-scan::walk` asserting \
`sub/b.txt` where the scanner produced `sub\\b.txt` — and `walk.rs:242` \
documents `separators left exactly as the OS gave them`, so the test \
contradicts the documented contract of the function it tests.

USE 502, WITH `--no-fail-fast`, AND SAY SO. Cargo's default fail-fast stops at \
the first failing binary and reported 170, never reaching four whole crates \
and missing one of the two failing groups entirely. A truncation that reads \
like a total is worse than a wrong number.

NO PRODUCTION SAFETY PATH WAS FOUND BROKEN ON EITHER PLATFORM. Every break is \
a Unix assumption in test code or in a Unix-only binary. Evidence: \
.omc/artifacts/phase-0a/windows-leg-first-run.md.
"""

[[guard.evidence]]
package = "xtask"
test = "evidence_artifacts::tests::ci_declares_all_three_platforms"
proves = "the CI matrix still names ubuntu-latest, windows-latest and macos-latest — a silent narrowing to Linux-only would otherwise leave the §9 clause reading as satisfied"

