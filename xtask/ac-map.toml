test = "dispatch::tests::tags_are_attached_across_a_hit_list_larger_than_the_bind_limit"
proves = "the ceiling had simply MOVED: `attach_tags` binds one parameter per hit, so chunking `hydrate` alone leaves the same failure one call later. Reverting only this half kills only this test — both halves independently load-bearing"

[[ac.evidence]]
package = "shepherd-daemon"
test = "state::tests::a_rebuild_from_an_older_snapshot_does_not_replace_a_newer_index"
proves = """
with a four-worker pool, two rebuilds race and the unconditional swap
let the LOSER win: files committed by the newer rebuild stay in SQLite and
vanish from search until a restart. The generation orders SNAPSHOTS, not
completions — SQLite's `BEGIN` is DEFERRED, so a read snapshot is pinned by the
first read inside it, and the ticket is therefore taken under a mutex held
across `BEGIN` + the count. The build itself stays outside the lock, which is
why rebuilds are not simply serialized.

The interleaving is DETERMINISTIC — snapshot A, commit, snapshot B, install B
then A — because a test that merely calls rebuild twice reads and swaps in one
breath and proves nothing. Asserted on a file still being FINDABLE, the fact a
user notices, not on a counter.
"""

[[ac.evidence]]
