# Lint half of §4.1 dependency rule 4.
#
# `[workspace.lints.clippy] disallowed_methods = "deny"` in the root Cargo.toml
# makes every crate deny calls to the methods listed here. The only module that
# may carry `#![allow(clippy::disallowed_methods)]` is
# `crates/shepherd-tier/src/destroy.rs`; `cargo xtask check-deps` (rule 4b)
# fails if that allow appears anywhere else.
#
# The list is EMPTY at Phase 0a and that is deliberate: clippy resolves each
# entry to a real item path, and none of these items exist yet. Populating it
# with paths to items that do not exist would make `cargo clippy` emit
# unresolved-path warnings and would put a decorative, non-firing rule in the
# tree — exactly the "tooling credited with running that did not exist" defect
# §9 rule 6 records.
#
# The Phase 2 owner (T8) MUST add these entries in the same change that creates
# the items, and `cargo xtask check-deps` rule 4a — a source-level scan that
# works today and is proved by `xtask/tests/rule4.rs` — is what holds the
# invariant in the meantime:
#
#   disallowed-methods = [
#     { path = "shepherd_placeholder::PlaceholderProvider::destroy_local",
#       reason = "§4.1 rule 4: only shepherd-tier::destroy may call this" },
#     { path = "shepherd_placeholder::PlaceholderProvider::dehydrate_placeholder", reason = "..." },
#     { path = "shepherd_placeholder::PlaceholderProvider::evict_placeholder", reason = "..." },
#     { path = "shepherd_storage::StorageAdapter::delete_object", reason = "..." },
#   ]
#
# `StorageAdapter::delete_system_object` is deliberately NOT listed. It is
# scoped by construction to the `_shepherd/` prefix, is callable by replica
# maintenance, and is never counted by the discard breaker (§4.1 rule 4).
disallowed-methods = []
