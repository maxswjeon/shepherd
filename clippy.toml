# Lint half of §4.1 dependency rule 4.
#
# `[workspace.lints.clippy] disallowed_methods = "deny"` in the root Cargo.toml
# makes every crate deny calls to the methods listed here. The only module that
# may carry `#![allow(clippy::disallowed_methods)]` is
# `crates/shepherd-tier/src/destroy.rs`; `cargo xtask check-deps` (rule 4b)
# fails if that allow appears anywhere else.
#
# POPULATED AT PHASE 2 (T8), in the change that created the items — which is
# exactly what the Phase-0a version of this file said had to happen. Clippy
# resolves each entry to a real item path, so an entry for an item that does not
# exist is a warning rather than a rule; that is why the list waited.
#
# `dehydrate_placeholder` and `evict_placeholder` are STILL absent, deliberately:
# `cfapi.rs` and `fileprovider.rs` are Phase 3, so those methods do not exist
# yet. They go in with the code, not before it. `check-deps` rule 4a — a source
# scan that needs no resolution — is what covers them meanwhile.
#
# `StorageAdapter::delete_system_object` is NOT listed and must not be. It is
# scoped by construction to the `_shepherd/` prefix, is callable by replica
# maintenance, and is never counted by the discard breaker (§4.1 rule 4).
#
# The single permitted `#![allow(clippy::disallowed_methods)]` lives at the top
# of `crates/shepherd-tier/src/destroy.rs`. `check-deps` rule 4b fails the build
# if it appears anywhere else.
disallowed-methods = [
    { path = "shepherd_placeholder::provider::PlaceholderProvider::destroy_local", reason = "§4.1 rule 4: only shepherd-tier::destroy may call this" },
    { path = "shepherd_storage::adapter::StorageAdapter::delete_object", reason = "§4.1 rule 4: only shepherd-tier::destroy may call this" },
]
