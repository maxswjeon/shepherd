# ===========================================================================
# bench-contract.toml — the precommitted numeric workload contract for
# Phase 0b, the index bake-off.
#
# §9's Phase 0a/0b gate requires this file to be "fixed *before* 0b runs".
# It is committed in its own commit, ahead of every commit that carries a
# measurement, so the git history is the evidence that the contract preceded
# the numbers rather than being fitted to them.
#
# ---------------------------------------------------------------------------
# THE ONE RULE THAT MATTERS
#
# The §4.6 tiebreak rule was written before this spike specifically so the
# spike could not rationalise its way to an answer. It is reproduced verbatim
# in [tiebreak] below. It is applied as written. If the measurements make the
# rule select a candidate the measurer would not have chosen, the rule wins and
# the tension is written down — it is not resolved by editing this file.
#
# Anyone reviewing this: a diff to [bars], [tiebreak] or [query_trace] dated
# after the first measurement commit is the failure mode this file exists to
# make visible.
# ===========================================================================

contract_version = 1

# ---------------------------------------------------------------------------
# Reference machine
#
# "Reference machine" appears exactly once in the plan and was specified
# nowhere; two reviewers flagged it. §9 pins it as "8-core x86-64, 32 GB RAM,
# NVMe SSD - recorded exactly in bench-contract.toml, and any substitution
# re-baselines rather than compares".
#
# The box this actually runs on is NOT that machine. It is a 32-vCPU KVM guest
# with 68 GiB of RAM on a QEMU virtual block device. Three deliberate decisions
# follow, and all three are recorded rather than absorbed:
#
# 1. CORE COUNT IS PINNED, because it is a decision-integrity hazard and not a
#    footnote. The in-RAM arena scan is embarrassingly parallel: on 32 cores it
#    would run roughly 4x faster than on the declared 8-core reference machine.
#    That is enough to pass the 50 ms bar here and fail it on the machine the
#    plan actually specifies — which would flip the winner that Phase 1 task T7
#    then builds on. So every measured run is pinned to 8 cores with
#    `taskset -c 0-7`. Full-machine numbers may be reported as supplementary,
#    clearly labelled, and are never the basis of the decision.
#
# 2. RAM AND STORAGE CANNOT BE CONSTRAINED DOWN and are not faked. 68 GiB of
#    RAM flatters warm mmap runs relative to a 32 GB machine; the cold-cache
#    runs (real `drop_caches`, not simulated) are what covers that. The disk is
#    a QEMU virtual block device — non-rotational, `none` scheduler — not a
#    bare-metal NVMe.
#
# 3. THEREFORE THIS RUN IS A NEW BASELINE, NOT A COMPARISON, in the contract's
#    own language. `bench-baseline.json` records the declared machine and the
#    probed machine as separate objects so the substitution stays visible.
# ---------------------------------------------------------------------------
[reference_machine]
declared_cores = 8
declared_ram_gib = 32
declared_storage_class = "NVMe SSD"
pin_to_cores = "0-7"
substitution_is_a_rebaseline = true

# ---------------------------------------------------------------------------
# Fixture
#
# The seed is the whole reproducibility story. The generator is counter-based:
# row `i` derives from `(seed, i)` alone, with no dependence on rows before it.
# That is what lets the corpus be generated in parallel, lets the query trace be
# derived without materialising the corpus, and lets any single row be
# re-derived by hand later to check a result.
#
# `centroids` and `cluster_noise` exist because uniformly random vectors are a
# useless ANN fixture: every point is equidistant from every other, HNSW has no
# structure to exploit, and both latency and recall become meaningless. Real
# embeddings are clustered on the unit hypersphere, so the fixture is
# `normalize(centroid + noise)`.
# ---------------------------------------------------------------------------
[fixture]
seed = 20260816
rows = 10_000_000
vectors = 10_000_000
dimensions = 384
vectors_per_shard = 1_000_000
centroids = 4096
cluster_noise = 0.45

# ---------------------------------------------------------------------------
# Query trace
#
# §9 fixes the composition: 40% prefix, 30% infix substring, 20% path-fragment,
# 10% semantic, "drawn from a committed trace file". The file is committed
# alongside this contract and is generated from `fixture.seed`, so it is both
# fixed in advance and reproducible from scratch.
#
# THE SPLIT THAT KEEPS BOTH NUMBERS HONEST. Per §4.6 and the routing table at
# the as-you-type row, the as-you-type path is L-only and **never invokes the
# ANN index**. So:
#
#   * the metadata bar (< 50 ms p95) is computed over the LEXICAL classes only
#     — prefix, infix, path_fragment — which are 90% of the trace;
#   * the vector bar (< 300 ms p95) is computed over the SEMANTIC class only,
#     which is 10% of the trace.
#
# Mixing them would corrupt both: semantic queries would drag the metadata p95
# up toward a bar that path never has to meet, and the fast lexical majority
# would flatter the vector p95 toward a bar it never had to meet either.
#
# THE n = 1000 RECONCILIATION. §9 requires "n = 1000 queries per run". A
# 1000-line trace at the mandated composition yields only 900 lexical and 100
# semantic queries, and a p95 over n = 100 is a single sample with no p99 worth
# printing. So the committed trace holds 10,000 queries at the exact mandated
# composition, and each RUN executes exactly n = 1000 from its own leg:
#
#   * metadata run r executes lexical[r*1000 .. (r+1)*1000] — 1000 DISTINCT
#     queries per run, no query reused across runs, so per-query cache warming
#     cannot inflate a repeat;
#   * vector run r executes the full 1000-query semantic subset. All three runs
#     use the same 1000 queries, which is correct: the three runs are
#     repetitions of one workload, which is what §9 asks for.
#
# The trace file is auditable: every line carries the source row id (lexical) or
# centroid id (semantic) it was derived from, so a reviewer can confirm the
# query actually matches something in the corpus rather than being a string
# that happens to return zero rows quickly.
# ---------------------------------------------------------------------------
[query_trace]
file = "crates/shepherd-bench/traces/query-trace-v1.tsv"
total_queries = 10_000
pct_prefix = 40
pct_infix = 30
pct_path_fragment = 20
pct_semantic = 10
lexical_classes = ["prefix", "infix", "path_fragment"]
semantic_classes = ["semantic"]

# ---------------------------------------------------------------------------
# Execution
#
# §9 fixes "concurrency = 4 concurrent query clients against a daemon under a
# background ingest load".
#
# RECORDED SUBSTITUTION: at Phase 0b there is no daemon. `shepherd-daemon` is a
# Phase 1 deliverable (task T6), so "against a daemon" cannot be honoured
# literally without inventing one, and inventing one would measure the IPC layer
# rather than the index. The 4 query clients are therefore 4 OS threads issuing
# queries concurrently against the shared index inside one process, and the
# background ingest is a 5th thread writing to that same index at the rate
# below. What this preserves is the property the clause is actually for: the
# index is measured under read concurrency AND concurrent mutation, not in
# quiet single-threaded isolation. What it does not include is IPC and
# serialisation cost, which Phase 5's re-run against the real daemon adds.
#
# Background ingest is not decoration either — it is where the three metadata
# candidates differ most sharply. FTS5 contends on the catalog's own WAL,
# tantivy pays segment commits, and the arena pays an append plus whatever
# locking it needs. A quiescent benchmark would hide exactly that difference.
# ---------------------------------------------------------------------------
[execution]
query_clients = 4
background_ingest = true
background_ingest_rows_per_sec = 2_000
cache_states = ["warm", "cold"]

# `top_k` is the ANN retrieval depth. §4.6's latency budget line is "ANN top-200
# across shards, parallel, per-shard deadline", so 200 is the depth the 300 ms
# bar was costed against. An earlier draft of this contract said 10, which would
# have measured a materially cheaper query than the plan budgets for and reported
# it against the plan's bar. Corrected to 200 before any measurement was taken —
# the correction makes the test harder, not easier, and the git history shows it
# landing ahead of the first result commit.
top_k = 200

# `result_limit` is the metadata leg's early-exit depth: one screenful of
# as-you-type results.
result_limit = 50

# ---------------------------------------------------------------------------
# Statistics — §9's rule, transcribed
#
# `accept_on` is load-bearing: the harness refuses to run if it is set to
# anything it does not implement, so this cannot be silently reinterpreted as
# "p95 of the pooled samples". Median-of-runs and pooled-p95 differ precisely
# when one run is anomalously slow, which is the case where it matters.
# ---------------------------------------------------------------------------
[statistics]
queries_per_run = 1_000
runs = 3
accept_on = "median_of_runs_p95"
drift_flag_pct = 10.0

# ---------------------------------------------------------------------------
# Bars
#
# metadata_p95_ms and vector_p95_ms are AC-40 and AC-41. The AC-46 ceiling range
# is §9's "supported AC-46 ceiling range: 4-16 GB, with < 4 GB rejected as
# unachievable at 10M x 384-dim (R-4) rather than silently accepted".
#
# ann_recall_at_10_floor IS NOT FROM THE PLAN. The plan sets no recall floor,
# and this spike is not entitled to invent an acceptance criterion. It is
# recorded here as a SANITY FLOOR only: its single job is to catch the failure
# where i8 quantisation produces an index that is fast and small and returns
# garbage, because a RAM number reported without a recall number cannot see
# that. A measured recall below this floor is escalated as a finding, never
# used to fail a candidate the plan did not authorise failing.
# ---------------------------------------------------------------------------
[bars]
metadata_p95_ms = 50.0
vector_p95_ms = 300.0
ac46_ceiling_min_gib = 4.0
ac46_ceiling_max_gib = 16.0
ann_recall_at_10_floor = 0.90

# ---------------------------------------------------------------------------
# The tiebreak rule
#
# `rule_text` is §4.6 verbatim. It is stored as data, in the file the harness
# reads, so that the selection can be replayed against the recorded numbers by
# someone who does not trust the write-up.
#
# THE THREE DURABILITY AXES. §9's gate adds "plus persistence, crash-consistency
# and cold-start-rebuild axes in the tiebreak rule". This was a late correction
# and it matters: scored on latency and RSS alone, this spike would silently
# select the catalog's entire durability architecture on speed grounds. The
# three candidates are not equivalent there and the differences are structural:
#
#   * an in-RAM arena has NO persistence at all and must be rebuilt at every
#     daemon start — and the daemon starts at every logon, so the rebuild is a
#     cost the user pays repeatedly, not once;
#   * tantivy keeps an independent on-disk index with its own commit semantics,
#     so a crash between the SQLite commit and the tantivy commit leaves two
#     stores disagreeing about what exists;
#   * FTS5 is transactional with the catalog for free. That is its one genuine
#     advantage and it was missing from the original scoring.
#
# HOW THE AXES ARE SCORED, stated in advance so the scoring cannot be invented
# after the numbers arrive:
#
#   * cold_start_rebuild_cost is MEASURED — wall-clock to make the index
#     queryable at 10M rows from a cold start;
#   * persistence_model and crash_consistency_with_catalog are DESIGN SCORES,
#     reported as reasoned judgements with their evidence, and explicitly NOT
#     dressed up as benchmarks. Fabricating a measurement for a structural
#     property would be worse than admitting it is a judgement.
#
# ORDER OF APPLICATION. §4.6's rule is a selection rule over latency and RAM.
# The durability axes are scored and reported for every candidate, but they do
# not silently re-rank the §4.6 selection. If they point at a different
# candidate than the rule selects, BOTH are reported and the tension is
# escalated — the rule is not quietly amended to agree with them.
# ---------------------------------------------------------------------------
[tiebreak]
rule_text = """
Decision rule, written now so the spike cannot rationalize: pick the lowest-RAM
candidate whose measured p95 is < 50 ms for the as-you-type profile at 10M rows
on the reference machine. If two are within 20% of each other on latency, pick
the lower RSS. If none passes, the plan escalates to the user (already recorded
as OQ-E) with the option of redefining AC-40's as-you-type semantics as
prefix/token matching and moving infix substring to the explicit-search path.
"""
latency_tie_pct = 20.0
scored_axes = [
    "latency_p95",
    "index_rss",
    "persistence_model",
    "crash_consistency_with_catalog",
    "cold_start_rebuild_cost",
]

# ---------------------------------------------------------------------------
# Disk guard
#
# Not from §9. This box starts the spike at 87% full with ~50 GiB free, and the
# f32 vector leg alone is projected at ~17 GB. Filling a shared development
# machine is an incident, not a data point, so each leg refuses to start below
# this floor and escalates instead of quietly running a smaller workload.
# ---------------------------------------------------------------------------
[disk_guard]
abort_below_free_gib = 25.0
